&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

    );

   * @param {string} property

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);

    globalThis.openai = {
      ...globalThis.openai,

      sendFollowUpMessage,

    };

      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),

  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||

      }

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {

&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;haiedu-design&#x27;);
const main=root.querySelector(&#x27;#hd-main&#x27;),frame=root.querySelector(&#x27;#hd-frame&#x27;),overlay=root.querySelector(&#x27;#hd-overlay&#x27;),dialog=root.querySelector(&#x27;#hd-dialog-content&#x27;);
let page=&#x27;home&#x27;,state=&#x27;active&#x27;,filter=&#x27;all&#x27;,lastFocus=null;
const skills=[
 {name:&#x27;Ֆիզիկական երևույթների ճանաչում&#x27;,value:92,kind:&#x27;ready&#x27;,answers:12},
 {name:&#x27;Ֆիզիկական մարմիններ և նյութեր&#x27;,value:88,kind:&#x27;ready&#x27;,answers:10},
 {name:&#x27;Դիտում և փորձ&#x27;,value:84,kind:&#x27;ready&#x27;,answers:9},
 {name:&#x27;Չափման գործիքների ընտրություն&#x27;,value:62,kind:&#x27;work&#x27;,answers:8},
 {name:&#x27;Չափման միավորներ&#x27;,value:58,kind:&#x27;work&#x27;,answers:8},
 {name:&#x27;Սանդղակի բաժանման արժեք&#x27;,value:47,kind:&#x27;work&#x27;,answers:6},
 {name:&#x27;Երկարության չափում&#x27;,value:40,kind:&#x27;work&#x27;,answers:5},
 {name:&#x27;Ժամանակի չափում&#x27;,value:null,kind:&#x27;new&#x27;,answers:0},
 {name:&#x27;Չափման արդյունքի գրանցում&#x27;,value:null,kind:&#x27;new&#x27;,answers:0},
 {name:&#x27;Չափման ճշտություն&#x27;,value:null,kind:&#x27;new&#x27;,answers:0}
];
const ico=name=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const status=kind=&gt;kind===&#x27;ready&#x27;?&#x27;&lt;span class=&quot;hd-pill teal&quot;&gt;✓ Պատրաստ է ստուգման&lt;/span&gt;&#x27;:kind===&#x27;work&#x27;?&#x27;&lt;span class=&quot;hd-pill amber&quot;&gt;Ամրապնդում է պետք&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;hd-pill neutral&quot;&gt;Դեռ չեք սկսել&lt;/span&gt;&#x27;;
const ring=(n,total,caption)=&gt;`&lt;div class=&quot;hd-ring&quot; role=&quot;img&quot; aria-label=&quot;${n}՝ ${total}-ից, ${caption}&quot;&gt;&lt;svg viewBox=&quot;0 0 120 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;49&quot; fill=&quot;none&quot; stroke=&quot;#ffffff25&quot; stroke-width=&quot;7&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;49&quot; fill=&quot;none&quot; stroke=&quot;#9be1ce&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; stroke-dasharray=&quot;${n/total*307.876} 307.876&quot;/&gt;&lt;/svg&gt;&lt;strong&gt;${n}&lt;small&gt;${total}-ից ${caption}&lt;/small&gt;&lt;/strong&gt;&lt;/div&gt;`;
const heading=(title,sub)=&gt;`&lt;div class=&quot;hd-page-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p&gt;${sub}&lt;/p&gt;&lt;/div&gt;${state!==&#x27;empty&#x27;?`&lt;span class=&quot;hd-subject-pill&quot;&gt;${ico(&#x27;atom&#x27;)}Ֆիզիկա · 7&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;`;
const stats=()=&gt;`&lt;section class=&quot;hd-stats&quot; aria-label=&quot;Ուսուցման տարբեր ցուցանիշներ&quot;&gt;&lt;article class=&quot;hd-stat&quot;&gt;&lt;span class=&quot;hd-stat-label&quot;&gt;${ico(&#x27;clipboard-check&#x27;)}Ելակետային ախտորոշիչ&lt;/span&gt;&lt;strong&gt;80&lt;span style=&quot;font-size:15px&quot;&gt;%&lt;/span&gt;&lt;/strong&gt;&lt;p&gt;16 / 20 ճիշտ պատասխան&lt;/p&gt;&lt;div class=&quot;hd-mini-bar&quot;&gt;&lt;span style=&quot;width:80%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;hd-stat&quot;&gt;&lt;span class=&quot;hd-stat-label&quot;&gt;${ico(&#x27;blocks&#x27;)}Պատրաստ են ստուգման&lt;/span&gt;&lt;strong&gt;3 &lt;span style=&quot;font-size:14px;color:var(--hd-muted)&quot;&gt;/ 10&lt;/span&gt;&lt;/strong&gt;&lt;p&gt;Գլուխ I-ի հմտություններից&lt;/p&gt;&lt;div class=&quot;hd-segment-bar&quot; aria-label=&quot;10 հմտությունից 3-ը պատրաստ են ստուգման&quot;&gt;${Array.from({length:10},(_,i)=&gt;`&lt;span class=&quot;${i&lt;3?&#x27;hd-filled&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;hd-stat&quot;&gt;&lt;span class=&quot;hd-stat-label&quot;&gt;${ico(&#x27;shield-check&#x27;)}Գլխի յուրացում&lt;/span&gt;&lt;strong class=&quot;hd-status-value&quot;&gt;Դեռ չի հաստատվել&lt;/strong&gt;&lt;p&gt;Հաստատվում է յուրացման ստուգմամբ&lt;/p&gt;&lt;/article&gt;&lt;/section&gt;`;
const courseCard=()=&gt;`&lt;article class=&quot;hd-panel hd-course-card&quot;&gt;&lt;div class=&quot;hd-course-title&quot;&gt;&lt;span class=&quot;hd-subject-icon&quot;&gt;${ico(&#x27;atom&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Ֆիզիկա · 7-րդ դասարան&lt;/h3&gt;&lt;p&gt;7Ա դասարան · 2026–2027&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hd-unit-label&quot;&gt;ԳԼՈՒԽ I&lt;/div&gt;&lt;h3&gt;Բնության ուսումնասիրության ֆիզիկական մեթոդները&lt;/h3&gt;&lt;div class=&quot;hd-course-progress&quot;&gt;&lt;div&gt;&lt;span&gt;Ստուգման պատրաստ հմտություններ&lt;/span&gt;&lt;strong&gt;${state===&#x27;active&#x27;?&#x27;3 / 10&#x27;:&#x27;—&#x27;}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;hd-bar&quot;&gt;&lt;span style=&quot;width:${state===&#x27;active&#x27;?30:0}%;background:var(--hd-teal)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hd-course-bottom&quot;&gt;&lt;span class=&quot;hd-pill ${state===&#x27;active&#x27;?&#x27;blue&#x27;:&#x27;neutral&#x27;}&quot;&gt;${state===&#x27;active&#x27;?&#x27;Ուսուցումն ընթացքի մեջ է&#x27;:&#x27;Սկսեք ախտորոշիչից&#x27;}&lt;/span&gt;&lt;button class=&quot;hd-text-button&quot; type=&quot;button&quot; data-page=&quot;progress&quot;&gt;Դիտել ${ico(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;`;
const timeline=()=&gt;`&lt;div class=&quot;hd-timeline&quot;&gt;&lt;div class=&quot;hd-event&quot;&gt;&lt;span class=&quot;hd-event-icon&quot;&gt;${ico(&#x27;play&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Վարժանքն ընթացքի մեջ է&lt;/strong&gt;&lt;p&gt;5 / 8 հարցի պատասխանել եք&lt;/p&gt;&lt;small&gt;Այսօր&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hd-event&quot;&gt;&lt;span class=&quot;hd-event-icon teal&quot;&gt;${ico(&#x27;check&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Վարժանքն ավարտված է&lt;/strong&gt;&lt;p&gt;6 / 8 ճիշտ պատասխան · 75%&lt;/p&gt;&lt;small&gt;Հոկտեմբերի 5&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hd-event&quot;&gt;&lt;span class=&quot;hd-event-icon teal&quot;&gt;${ico(&#x27;check&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Ախտորոշիչն ավարտված է&lt;/strong&gt;&lt;p&gt;16 / 20 ճիշտ պատասխան · 80%&lt;/p&gt;&lt;small&gt;Հոկտեմբերի 1&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
function activeHome(){return heading(&#x27;Բարի վերադարձ, Անի&#x27;,&#x27;Շարունակեք այնտեղից, որտեղ կանգ եք առել։&#x27;)+`&lt;section class=&quot;hd-hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;hd-kicker&quot;&gt;ՀԱՋՈՐԴ ՔԱՅԼԸ · ՖԻԶԻԿԱ 7&lt;/span&gt;&lt;h2&gt;Շարունակենք վարժանքը&lt;/h2&gt;&lt;p&gt;Մնացել է 3 հարց։ Ձեր պատասխանները պահպանված են։&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;hd-hero-ring&quot;&gt;${ring(5,8,&#x27;հարց&#x27;)}&lt;small&gt;Ընթացիկ վարժանք&lt;/small&gt;&lt;/div&gt;&lt;button class=&quot;hd-primary&quot; type=&quot;button&quot; data-action=&quot;resume&quot;&gt;Շարունակել վարժանքը ${ico(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/section&gt;`+stats()+`&lt;div class=&quot;hd-lower-grid&quot;&gt;&lt;section&gt;&lt;div class=&quot;hd-section-top&quot;&gt;&lt;h2&gt;Իմ դասընթացները&lt;/h2&gt;&lt;/div&gt;${courseCard()}&lt;/section&gt;&lt;section&gt;&lt;div class=&quot;hd-section-top&quot;&gt;&lt;h2&gt;Վերջին քայլերը&lt;/h2&gt;&lt;/div&gt;${timeline()}&lt;/section&gt;&lt;/div&gt;`;}
function steps(){return `&lt;section&gt;&lt;div class=&quot;hd-section-top&quot;&gt;&lt;h2&gt;Ձեր առաջին քայլերը&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;hd-first-steps&quot;&gt;&lt;article class=&quot;hd-step ${state===&#x27;empty&#x27;?&#x27;current&#x27;:&#x27;done&#x27;}&quot;&gt;&lt;span class=&quot;hd-step-number&quot;&gt;${state===&#x27;empty&#x27;?&#x27;1&#x27;:&#x27;✓&#x27;}&lt;/span&gt;&lt;h3&gt;Միանալ դասարանին&lt;/h3&gt;&lt;p&gt;${state===&#x27;empty&#x27;?&#x27;Ուսուցչի հրավերով կամ կոդով։&#x27;:&#x27;Դուք միացել եք 7Ա դասարանին։&#x27;}&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;hd-step ${state===&#x27;fresh&#x27;?&#x27;current&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;hd-step-number&quot;&gt;2&lt;/span&gt;&lt;h3&gt;Անցնել ախտորոշիչը&lt;/h3&gt;&lt;p&gt;Պարզեք՝ ինչ գիտեք և որտեղից սկսել։&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;hd-step&quot;&gt;&lt;span class=&quot;hd-step-number&quot;&gt;3&lt;/span&gt;&lt;h3&gt;Սկսել վարժանքը&lt;/h3&gt;&lt;p&gt;Բացվում է ախտորոշիչից հետո։&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;`;}
function newHome(){const empty=state===&#x27;empty&#x27;;return heading(&#x27;Բարի գալուստ, Անի&#x27;,&#x27;Ձեր ուսուցման ճանապարհը սկսվում է այստեղ։&#x27;)+`&lt;section class=&quot;hd-hero&quot;&gt;&lt;div&gt;&lt;span class=&quot;hd-kicker&quot;&gt;${empty?&#x27;ԱՌԱՋԻՆ ՔԱՅԼԸ&#x27;:&#x27;ՖԻԶԻԿԱ 7 · ԳԼՈՒԽ I&#x27;}&lt;/span&gt;&lt;h2&gt;${empty?&#x27;Միացեք ձեր դասարանին&#x27;:&#x27;Սկսենք ձեր մեկնարկային մակարդակից&#x27;}&lt;/h2&gt;&lt;p&gt;${empty?&#x27;Օգտագործեք ուսուցչի ուղարկած հրավերը կամ դասարանի կոդը։&#x27;:&#x27;Ախտորոշիչը կօգնի որոշել՝ որ հմտություններն ամրապնդել։&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;hd-hero-ring&quot;&gt;${ring(empty?0:1,3,&#x27;քայլ&#x27;)}&lt;/div&gt;&lt;button class=&quot;hd-primary&quot; type=&quot;button&quot; data-action=&quot;${empty?&#x27;join&#x27;:&#x27;diagnostic&#x27;}&quot;&gt;${empty?&#x27;Միանալ դասարանին&#x27;:&#x27;Սկսել ախտորոշիչը&#x27;} ${ico(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/section&gt;`+steps()+(empty?`&lt;section class=&quot;hd-empty-panel&quot;&gt;&lt;span class=&quot;hd-empty-symbol&quot;&gt;${ico(&#x27;book-open&#x27;)}&lt;/span&gt;&lt;h2&gt;Ձեր առարկաները կլինեն այստեղ&lt;/h2&gt;&lt;p&gt;Դասարանին միանալուց հետո կտեսնեք հասանելի դասընթացներն ու ձեր հաջորդ քայլը։&lt;/p&gt;&lt;/section&gt;`:`&lt;section&gt;&lt;div class=&quot;hd-section-top&quot;&gt;&lt;h2&gt;Իմ դասընթացները&lt;/h2&gt;&lt;/div&gt;${courseCard()}&lt;/section&gt;`);}
function skillRows(){return skills.map((s,i)=&gt;({...s,index:i})).filter(s=&gt;filter===&#x27;all&#x27;||s.kind===filter).map(s=&gt;`&lt;article class=&quot;hd-skill&quot; data-kind=&quot;${s.kind}&quot;&gt;&lt;div class=&quot;hd-skill-name&quot;&gt;&lt;span class=&quot;hd-skill-number&quot;&gt;${String(s.index+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${s.name}&lt;/h3&gt;${status(s.kind)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hd-skill-meter&quot;&gt;&lt;div class=&quot;hd-meter-label&quot;&gt;&lt;span&gt;Վարժանք&lt;/span&gt;&lt;strong&gt;${s.value===null?&#x27;—&#x27;:s.value+&#x27;%&#x27;}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;hd-bar&quot; aria-label=&quot;${s.value===null?&#x27;Տվյալներ դեռ չկան&#x27;:&#x27;Վարժանքի ցուցանիշ՝ &#x27;+s.value+&#x27; տոկոս&#x27;}&quot;&gt;&lt;span style=&quot;width:${s.value||0}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;hd-arrow&quot; type=&quot;button&quot; data-skill=&quot;${s.index}&quot; aria-label=&quot;${s.name}․ մանրամասներ&quot;&gt;${ico(&#x27;chevron-right&#x27;)}&lt;/button&gt;&lt;/article&gt;`).join(&#x27;&#x27;);}
function progress(){if(state!==&#x27;active&#x27;)return heading(&#x27;Իմ առաջընթացը&#x27;,&#x27;Ֆիզիկա · 7-րդ դասարան&#x27;)+`&lt;section class=&quot;hd-empty-panel&quot;&gt;&lt;span class=&quot;hd-empty-symbol&quot;&gt;${ico(&#x27;chart-no-axes-combined&#x27;)}&lt;/span&gt;&lt;h2&gt;Առաջընթացի տվյալներ դեռ չկան&lt;/h2&gt;&lt;p&gt;${state===&#x27;empty&#x27;?&#x27;Նախ միացեք ձեր դասարանին։ Արդյունքները կհայտնվեն առաջին աշխատանքից հետո։&#x27;:&#x27;Սկսեք ախտորոշիչից։ Դրանից հետո այստեղ կտեսնեք ձեր մեկնարկային արդյունքն ու հմտությունների զարգացումը։&#x27;}&lt;/p&gt;&lt;button class=&quot;hd-primary&quot; type=&quot;button&quot; data-action=&quot;${state===&#x27;empty&#x27;?&#x27;join&#x27;:&#x27;diagnostic&#x27;}&quot;&gt;${state===&#x27;empty&#x27;?&#x27;Միանալ դասարանին&#x27;:&#x27;Սկսել ախտորոշիչը&#x27;} ${ico(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/section&gt;`+steps();return heading(&#x27;Տեսեք՝ ինչպես եք առաջ շարժվում&#x27;,&#x27;Ֆիզիկա 7 · Բնության ուսումնասիրության ֆիզիկական մեթոդները&#x27;)+stats()+`&lt;section class=&quot;hd-panel&quot;&gt;&lt;div class=&quot;hd-progress-intro&quot;&gt;&lt;div&gt;&lt;h2&gt;Հմտությունների պատկերը&lt;/h2&gt;&lt;p&gt;Վարժանքի ցուցանիշը և ստուգման պատրաստությունը ներկայացված են առանձին։&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hd-breakdown&quot;&gt;&lt;div&gt;&lt;strong&gt;3&lt;/strong&gt;&lt;span class=&quot;hd-dot teal&quot;&gt;&lt;/span&gt;Պատրաստ են ստուգման&lt;/div&gt;&lt;div&gt;&lt;strong&gt;4&lt;/strong&gt;&lt;span class=&quot;hd-dot amber&quot;&gt;&lt;/span&gt;Ամրապնդում են պահանջում&lt;/div&gt;&lt;div&gt;&lt;strong&gt;3&lt;/strong&gt;&lt;span class=&quot;hd-dot&quot;&gt;&lt;/span&gt;Դեռ չեք սկսել&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;hd-filter-row&quot; aria-label=&quot;Հմտությունների զտում&quot;&gt;${[[&#x27;all&#x27;,&#x27;Բոլորը · 10&#x27;],[&#x27;work&#x27;,&#x27;Ամրապնդել · 4&#x27;],[&#x27;ready&#x27;,&#x27;Պատրաստ · 3&#x27;],[&#x27;new&#x27;,&#x27;Չսկսված · 3&#x27;]].map(([k,l])=&gt;`&lt;button type=&quot;button&quot; class=&quot;hd-filter&quot; data-filter=&quot;${k}&quot; aria-pressed=&quot;${filter===k}&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div id=&quot;hd-skills&quot;&gt;${skillRows()}&lt;/div&gt;&lt;/section&gt;&lt;details class=&quot;hd-proof&quot;&gt;&lt;summary&gt;Ինչպե՞ս կարդալ այս ցուցանիշները&lt;/summary&gt;&lt;p&gt;Ախտորոշիչը ցույց է տալիս մեկնարկային արդյունքը։ Վարժանքի ցուցանիշը նկարագրում է ընթացիկ ուսումնական տվյալները։ Գլխի յուրացումը հաստատվում է առանձին ստուգմամբ։&lt;/p&gt;&lt;/details&gt;&lt;section&gt;&lt;div class=&quot;hd-section-top&quot;&gt;&lt;h2&gt;Վերջին աշխատանքները&lt;/h2&gt;&lt;/div&gt;${timeline()}&lt;/section&gt;`;}
function icons(){if(typeof lucide!==&#x27;undefined&#x27;)lucide.createIcons({attrs:{width:16,height:16}});}
function render(){main.innerHTML=page===&#x27;home&#x27;?(state===&#x27;active&#x27;?activeHome():newHome()):progress();root.querySelector(&#x27;#hd-breadcrumb&#x27;).textContent=page===&#x27;home&#x27;?&#x27;Իմ ուսուցումը&#x27;:&#x27;Ֆիզիկա 7 / Առաջընթաց&#x27;;root.querySelector(&#x27;#hd-year&#x27;).textContent=state===&#x27;empty&#x27;?&#x27;Նոր սովորող&#x27;:&#x27;2026–2027 · 7Ա&#x27;;root.querySelector(&#x27;#hd-course-nav&#x27;).hidden=state===&#x27;empty&#x27;;root.querySelectorAll(&#x27;[data-page]&#x27;).forEach(b=&gt;{b.classList.toggle(&#x27;hd-current&#x27;,b.dataset.page===page);if(b.dataset.page===page)b.setAttribute(&#x27;aria-current&#x27;,&#x27;page&#x27;);else b.removeAttribute(&#x27;aria-current&#x27;);});icons();}
function openModal(content){lastFocus=document.activeElement;dialog.innerHTML=content;overlay.hidden=false;root.querySelector(&#x27;.hd-app&#x27;).inert=true;icons();root.querySelector(&#x27;.hd-close&#x27;).focus();}
function closeModal(){overlay.hidden=true;root.querySelector(&#x27;.hd-app&#x27;).inert=false;if(lastFocus?.isConnected)lastFocus.focus();}
const title=(k,t)=&gt;`&lt;span class=&quot;hd-kicker&quot;&gt;${k}&lt;/span&gt;&lt;h2 id=&quot;hd-dialog-title&quot;&gt;${t}&lt;/h2&gt;`;
