<div class="review"><div><strong>HaiEdu · Դիզայնի նախադիտում</strong><p id="reviewNote">Օրինակային տվյալներ · Հաշվի տվյալները չեն փոփոխվում</p></div><div class="review-controls"><label>Սցենար <select id="scenario"><option value="active">Արդեն սովորում է · մի քանի առարկա</option><option value="new">Նոր սովորող · նախ ախտորոշիչ</option><option value="single">Միայն մեկ դասընթաց</option><option value="empty">Առանց դասարանի</option><option value="school">Մեկ այլ թույլատրված դպրոց</option><option value="grade8">8-րդ դասարան · ապագա օրինակ</option><option value="history">Նախորդ տարիներ · ապագա բաժին</option><option value="placement">Դասարանի տեղաբաշխում · ապագա</option><option value="delivery">Առարկան պատրաստ չէ · ապագա</option><option value="loading">Տվյալները բեռնվում են</option><option value="error">Կապի սխալ</option><option value="blocked">Հասանելիությունը դադարեցված է</option><option value="ready">Յուրացման ստուգումը հասանելի է</option><option value="complete">Թեման յուրացված է</option><option value="exhausted">Ստուգման փորձերն ավարտված են</option><option value="materials-empty">Հավելյալ նյութեր · դեռ չկան</option><option value="materials-unavailable">Հավելյալ նյութեր · նյութը հեռացված է</option></select></label><div class="device" aria-label="Նախադիտման չափը"><button data-device="desktop" aria-pressed="true" aria-label="Համակարգչի տեսք · 1280 px">▣</button><button data-device="tablet" aria-pressed="false" aria-label="Պլանշետի տեսք · 768 px">▤</button><button data-device="phone" aria-pressed="false" aria-label="Հեռախոսի տեսք · 360 px">▯</button></div></div></div>

const paths={home:'M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9',book:'M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1zm0 0v15',chart:'M4 3v18h17M8 16v-5m5 5V7m5 9V4',work:'M7 3h10v3h4v15H3V6h4zm0 0v5h10V3M7 12h10M7 16h6',history:'M3 5v5h5M3 10a9 9 0 1 1 1 8M12 7v5l3 2',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0M4 21v-2a8 8 0 0 1 16 0v2',arrow:'M4 12h16m-6-6 6 6-6 6',leaf:'M4 20C3 7 12 3 21 3c0 10-5 17-13 15M4 20 16 8',atom:'M12 10v4m-2-2h4M4 5c-6 3 11 18 16 14S9 1 4 5M20 5C14 1 0 16 4 19S26 8 20 5',check:'m5 12 4 4L20 5',lock:'M6 10h12v11H6zm3 0V6a3 3 0 0 1 6 0v4',sound:'M3 9h4l5-5v16l-5-5H3zm13-2c3 2 3 8 0 10m3-13c5 4 5 12 0 16',spark:'m12 2 2 7 8 3-8 2-2 8-2-8-8-2 8-3z',help:'M9 8a3 3 0 1 1 5 2c-2 1-2 2-2 4m0 4h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',mail:'M2 5h20v14H2zm0 0 10 8L22 5'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.book}"/></svg>`;
const state={scenario:'active',page:'home',course:'english',tab:'course',filter:'all',focus:false,draft:'',saved:false,materialUnit:'all',materialSource:'all',materialFormat:'all'};
const subjects={english:{name:'Անգլերեն',icon:'leaf',tone:'teal',unit:'Մեր մոլորակը',label:'Բաժին 3',ready:4,total:9,skill:'Լսել և հասկանալ հիմնական միտքը',units:['Իմ բնավորությունն ու ոճը','Երաժշտությունը՝ համամարդկային լեզու','Մեր մոլորակը']},physics:{name:'Ֆիզիկա',icon:'atom',tone:'amber',unit:'Նյութի կառուցվածքը',label:'Գլուխ II',ready:3,total:8,skill:'Բացատրել նյութի մասնիկային կառուցվածքը',units:['Բնության ուսումնասիրությունը','Նյութի կառուցվածքը','Շարժում և փոխազդեցություն']}};
const navs=[['home','Գլխավոր','home'],['courses','Դասընթացներ','book'],['progress','Առաջընթաց','chart'],['work','Իմ աշխատանքները','work'],['materials','Հավելյալ նյութեր','book']];
const course=()=>subjects[state.course], fresh=()=>state.scenario==='new', past=()=>state.scenario==='history';
const readyCount=(key=state.course)=>fresh()?0:['ready','complete'].includes(state.scenario)&&key===state.course?subjects[key].total:subjects[key].ready;
function heading(title,subtitle='',end=''){return `<div class="heading"><div><h1>${title}</h1>${subtitle?`<p>${subtitle}</p>`:''}</div>${end}</div>`;}
function button(label,action,cls='btn',more=''){return `<button type="button" class="${cls}" data-action="${action}" ${more}>${label}</button>`;}
function pill(label,tone=''){return `<span class="pill ${tone}">${label}</span>`;}
function courses(){return state.scenario==='single'?['english']:['english','physics'];}
function showDialog(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialog').showModal();}
let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000);}
function shell(){const future=['grade8','history','placement','delivery'].includes(state.scenario);$('reviewNote').textContent=future?'Ապագա հնարավորության օրինակ · Դեռ չի ներդրվել · Օրինակային տվյալներ':'Օրինակային տվյալներ · Հաշվի տվյալները չեն փոփոխվում';$('context').innerHTML=state.scenario==='empty'?'<strong>Քո հաշիվը պատրաստ է</strong><span>Դասարան դեռ չկա</span>':state.scenario==='placement'?'<strong>2027–2028 ուսումնական տարի</strong><span>Դասարանը դեռ հաստատված չէ</span>':`<strong>${past()?'2025–2026 · 6-րդ դասարան':state.scenario==='grade8'?'2027–2028 · 8-րդ դասարան':'2026–2027 · 7-րդ դասարան'}</strong><span>${state.scenario==='school'?'Օրինակային դպրոց Բ · 7B':'Օրինակային դպրոց Ա · '+(past()?'6A':state.scenario==='grade8'?'8A':'7A')}</span>`;
const items=[...navs,...(past()?[['history','Նախորդ տարիներ','history']]:[])];$('nav').innerHTML=items.map(([id,label,i])=>`<button type="button" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('');$('mobileNav').innerHTML=navs.map(([id,label,i])=>`<button type="button" aria-label="${label}" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${icon(i)}<span>${id==='work'?'Աշխատանք':id==='courses'?'Առարկաներ':id==='materials'?'Նյութեր':label}</span></button>`).join('');$('crumb').textContent=state.focus?'Ուսումնական աշխատանք':([...items,['account','Հաշիվ և գաղտնիություն']].find(n=>n[0]===state.page)?.[1]||'Իմ ուսուցումը');$('frame').classList.toggle('focus',state.focus);}
function tile(key){const c=subjects[key],n=readyCount(key);return `<article class="card course-tile ${state.course===key?'selected':''}"><div class="course-head"><span class="subject-icon ${c.tone}">${icon(c.icon)}</span><div><h3>${c.name}</h3><small>${state.scenario==='grade8'?'8-րդ':'7-րդ'} դասարան · ${state.scenario==='school'?'դպրոց Բ':'դպրոց Ա'}</small></div></div><div><p>${c.label}</p><strong>${c.unit}</strong></div><div><div class="metric-label"><span>Ստուգման պատրաստ հմտություններ</span><strong>${n}/${c.total}</strong></div><div class="bar ${c.tone}" aria-label="${n} պատրաստ հմտություն ${c.total}-ից"><span style="width:${n/c.total*100}%"></span></div></div><div class="tile-foot">${pill(fresh()?'Նախ՝ ախտորոշիչ':key==='english'?'Վարժանքը շարունակվում է':'Ամրապնդում է պետք',fresh()?'amber':key==='english'?'teal':'neutral')}<button class="btn secondary" data-select="${key}">Բացել ${icon('arrow')}</button></div></article>`;}
function journey(){return `<div class="card"><div class="section-head"><h2>Քո ուղին այս թեմայում</h2></div><div class="journey">${[['Սկզբնական ախտորոշիչ',fresh()?'Սկսելու առաջին քայլը':'Ավարտված է','check'],['Վարժանք և ամրապնդում',fresh()?'Բացվում է ախտորոշիչից հետո':'Քայլ առ քայլ զարգացնում ես հմտություններդ','book'],['Յուրացման ստուգում','Երբ պատրաստ լինեն պահանջվող հմտությունները','lock']].map(([title,text,i],n)=>`<div class="step"><span class="step-mark ${n===(fresh()?0:1)?'current':n>=(fresh()?1:2)?'locked':''}">${icon(i)}</span><div><strong>${title}</strong><small>${text}</small></div></div>`).join('')}</div></div>`;}
function feedback(){return `<article class="card feedback"><div class="row"><span class="subject-icon">${icon('mail')}</span>${pill('Վերանայման է վերադարձված','neutral')}</div><h3>Ուսուցչի արձագանքը քեզ է սպասում</h3><p>Անգլերեն · Գրավոր աշխատանք<br>«Ավելացրու մի օրինակ, որը կհիմնավորի քո առաջարկը»։</p>${button('Բացել աշխատանքը →','work','text-btn')}</article>`;}
function home(){if(['empty','placement','delivery','error','blocked','loading'].includes(state.scenario))return special();const c=course(),n=readyCount(),ready=state.scenario==='ready',complete=state.scenario==='complete',exhausted=state.scenario==='exhausted';return `${heading('Ողջո՜ւյն, Անի','Ամեն նոր քայլով սովորելն ավելի հեշտ է դառնում։',pill('Քո ուսուցումը'))}<section class="hero"><div><span class="eyebrow">${fresh()?'ՍԿՍԻՐ ԱՅՍՏԵՂԻՑ':complete?'ԵՎՍ ՄԵԿ ՔԱՅԼ ԱՌԱՋ':'ՇԱՐՈՒՆԱԿԻՐ ՈՒՍՈՒՑՈՒՄԸ'}</span><h2>${fresh()?'Ծանոթացիր քո ուժեղ կողմերին':ready?'Պատրաստ ես ստուգել քեզ':complete?'Այս թեմայի ստուգումն անցել ես':exhausted?'Կրկնությամբ ամրապնդիր գիտելիքդ':c.skill}</h2><p>${fresh()?'Սկզբնական ախտորոշիչը կօգնի հասկանալ՝ ինչն արդեն գիտես և ինչին ուշադրություն դարձնել։':complete?'Կարող ես տեսնել արդյունքը կամ վերադառնալ նյութերին։':exhausted?'Նոր ստուգման փորձ հասանելի չէ։ Թեմայի կրկնությունը բաց է։':ready?'Դիտիր այս թեմայի ստուգման կանոնները և սկսիր, երբ պատրաստ լինես։':'Քո վարժանքը պահպանված է։ Շարունակիր այնտեղից, որտեղ կանգ ես առել։'}</p><div class="row">${button(fresh()?'Բացել ախտորոշիչը':ready?'Դիտել ստուգումը':complete?'Դիտել արդյունքը':exhausted?'Կրկնել թեման':'Շարունակել վարժանքը '+icon('arrow'),fresh()||ready||complete?'assessment':exhausted?'review':'focus','btn light')}</div><div class="meta">${c.name} · ${c.label} · ${c.unit}</div></div><div class="hero-visual"><div class="orbit"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff22" stroke-width="7"/><circle cx="60" cy="60" r="50" fill="none" stroke="#8fe0c5" stroke-width="7" stroke-linecap="round" stroke-dasharray="${n/c.total*314} 314"/></svg><div class="ring-text"><strong>${n}<span style="font-size:19px;opacity:.75">/${c.total}</span></strong><small>պատրաստ հմտություն</small></div></div><small>Վարժանքի պատրաստվածություն<br>Ստուգման արդյունք չէ</small></div></section><div class="split"><section><div class="section-head"><h2>Իմ դասընթացները</h2>${button('Դիտել բոլորը →','courses','text-btn')}</div><div class="cards">${courses().map(tile).join('')}</div></section><aside class="stack">${fresh()?journey():feedback()}${!fresh()?journey():''}</aside></div><div class="notice">${icon('help')}<span>Փորձնական հարթակ · Առարկայական փորձագիտական ստուգումը շարունակվում է։</span></div>`;}
function picker(){return `<label class="small muted">Դասընթաց <select id="coursePicker">${courses().map(k=>`<option value="${k}" ${state.course===k?'selected':''}>${subjects[k].name} · ${state.scenario==='grade8'?8:7}-րդ դասարան</option>`).join('')}</select></label>`;}
function courseView(){const c=course();return `${heading(c.name+' · '+(state.scenario==='grade8'?8:7)+'-րդ դասարան',c.label+' · '+c.unit,picker())}<div class="tabs" aria-label="Դասընթացի բաժիններ">${[['assessment','Գնահատումներ'],['course','Դասընթաց'],['progress','Առաջընթաց']].map(([id,label])=>`<button data-tab="${id}" aria-pressed="${state.tab===id}">${label}</button>`).join('')}</div>${state.tab==='assessment'?assessments():state.tab==='progress'?progressBody():`<div class="split"><section class="card"><div class="section-head"><h2>Ուսուցման քարտեզ</h2>${pill(c.label)}</div><div class="journey">${c.units.map((u,n)=>`<div class="step"><span class="step-mark ${n===(state.course==='english'?2:1)?'current':''}">${n+1}</span><div><strong>${u}</strong><small>${n===(state.course==='english'?2:1)?'Ընթացիկ թեմա':'Նյութեր և պահպանված արդյունքներ'}</small></div>${button(n===(state.course==='english'?2:1)?'Շարունակել':'Դիտել',n===(state.course==='english'?2:1)?'focus':'pastunit','text-btn')}</div>`).join('')}</div></section><section class="stack">${journey()}<div class="card"><h3>Թեմայի նյութերը</h3><p class="muted small">Ուղեցույցներ և գրավոր աշխատանք՝ առանձին բաժիններում։</p><div class="row">${button('Ուղեցույցներ','guide','text-btn')}${button('Գրավոր աշխատանք','work','text-btn')}${button('Հավելյալ նյութեր','materials','text-btn')}</div></div></section></div><div class="notice">${icon('book')}<span>Խոսքը և գործնական ներկայացումները գնահատվում են դասարանում։ Դրանք չեն միավորվում ավտոմատ ստուգման արդյունքին։</span></div>`}`;}
function assessments(){const done=state.scenario==='complete',ready=state.scenario==='ready',exhausted=state.scenario==='exhausted';return `<div class="section-grid"><article class="card"><span class="subject-icon">${icon('chart')}</span><h3>Սկզբնական ախտորոշիչ</h3>${pill(fresh()?'Սկսելու քայլը':'Ավարտված է',fresh()?'amber':'teal')}<p>Ճանաչիր թեմայի քո ուժեղ կողմերն ու սովորելու կարիքները։</p>${button(fresh()?'Դիտել կանոնները':'Դիտել արդյունքը',fresh()?'rules':'diagnostic-result','btn secondary')}</article><article class="card"><span class="subject-icon teal">${icon('check')}</span><h3>Յուրացման ստուգում</h3>${pill(done?'Ստուգումն անցած է':ready?'Հասանելի է':exhausted?'Փորձերն ավարտված են':'Դեռ ամրապնդում է պետք',done?'teal':ready?'':'amber')}<p>${fresh()?'Նախ ավարտիր ախտորոշիչը։':exhausted?'Նոր փորձ չի տրամադրվում։ Կարող ես կրկնել թեման։':'Հասանելիությունը որոշվում է այս թեմայի հմտություններով և ստուգման կանոններով։'}</p>${done?button('Տեսնել արդյունքը','result','btn secondary'):ready?button('Դիտել կանոնները','rules'):button('Սկսել ստուգումը','none','btn','disabled')}</article><article class="card"><span class="subject-icon amber">${icon('history')}</span><h3>Թեմայի կրկնություն</h3><p>Վերադարձիր նյութերին և ամրապնդիր այն, ինչի վրա դեռ աշխատում ես։</p>${button('Բացել կրկնությունը','review','btn secondary',fresh()?'disabled':'')}</article></div><details class="card"><summary>Ինչպե՞ս են հաշվարկվում արդյունքները</summary><p class="muted small">Ախտորոշիչը, վարժանքի պատրաստվածությունը, յուրացման ստուգումն ու ուսուցչի գրավոր գնահատումը առանձին տվյալներ են։ Կիրառվում են ընտրված թեմայի հաստատված կանոնները։</p></details>`;}
function skillData(){return [ ['Բառապաշար և իմաստ','ready',true],['Քերականական կառուցվածքներ','developing',true],['Կարդալ և հասկանալ','ready',true],['Լսել և հասկանալ','developing',true],['Գրել և հիմնավորել','teacher',false] ];}
function progressBody(){const labels={ready:'Պատրաստ է',developing:'Ամրապնդում է պետք',teacher:'Ուսուցչի գնահատում'};return `<div class="section-grid"><div class="card"><span class="muted small">Վարժանքի պատրաստվածություն</span><strong class="stat-number">${readyCount()}/${course().total}</strong><p>Այս թեմայի պահանջվող ավտոմատ հմտությունները</p></div><div class="card"><span class="muted small">Յուրացման ստուգում</span><h3>${state.scenario==='complete'?'Ստուգումն անցած է':'Դեռ հաստատված չէ'}</h3><p>Առանձին ստուգման արդյունք</p></div><div class="card"><span class="muted small">Գրավոր աշխատանք</span><h3>${fresh()?'Դեռ չի ներկայացվել':'Վերանայման փուլում'}</h3><p>Ուսուցչի առանձին արձագանք և գնահատում</p></div></div><div class="section-head"><h2>Հմտությունների քարտեզ</h2><div class="filters" aria-label="Հմտության ֆիլտրեր">${[['all','Բոլորը'],['developing','Ամրապնդել'],['ready','Պատրաստ']].map(([id,l])=>`<button data-filter="${id}" aria-pressed="${state.filter===id}">${l}</button>`).join('')}</div></div><div class="skill-list">${skillData().map(([title,s,automatic],i)=>({title,s,automatic,i})).filter(x=>state.filter==='all'||(!fresh()&&x.s===state.filter)).map(x=>`<button class="skill" data-skill="${x.i}"><span class="skill-num">${String(x.i+1).padStart(2,'0')}</span><span><strong>${x.title}</strong><small>${fresh()?'Տվյալները դեռ բավարար չեն':x.automatic?'Տես հմտության վիճակն ու հաջորդ քայլը':'Առանձին աշխատանք և ուսուցչի արձագանք'}</small></span>${pill(fresh()?'Դեռ չի սկսվել':labels[x.s],x.s==='ready'&&!fresh()?'teal':x.s==='teacher'?'neutral':'amber')}</button>`).join('')}</div><p class="footnote">Նախադիտումը ցույց է տալիս հմտության քարտերի ձևը։ Ամբողջական ցուցակը և չափանիշները կբեռնվեն ընտրված ծրագրից։</p>`;}

 const rows=state.scenario==='materials-empty'?[]:materialRows().filter(r=>(state.materialUnit==='all'||String(r.unit)===state.materialUnit)&&(state.materialSource==='all'||r.source===state.materialSource)&&(state.materialFormat==='all'||r.format===state.materialFormat));
 const unavailable=state.scenario==='materials-unavailable';

 <div class="notice">${icon('book')}<span>Աշխատիր քո ցանկությամբ։ Նյութը բացելը կամ ներբեռնելը գնահատական չի փոխում։</span></div>
 <div class="material-filters" aria-label="Նյութերի զտիչներ">${materialSelect('materialUnit','Թեմա',[['all','Բոլոր թեմաները'],...course().units.map((u,i)=>[String(i),u])])}${materialSelect('materialSource','Ով է տրամադրել',[['all','Բոլորը'],['teacher','Ուսուցչից'],['platform','Հարթակից']])}${materialSelect('materialFormat','Ձևաչափ',[['all','Բոլորը'],['pdf','PDF'],['link','Հղում']])}</div>
 ${unavailable?`<section class="card empty">${icon('lock')}<h2>Այս նյութն այլևս հասանելի չէ</h2><p>Նյութը հեռացվել է կամ դրա հասանելիությունը փոխվել է։ Այլ նյութերի համար բացիր դասընթացը։</p>${button('Բացել դասընթացը','courses','btn secondary')}</section>`:rows.length?`<div class="cards">${rows.map(r=>`<article class="card material-card" data-material-id="${r.id}"><div class="row"><span class="subject-icon ${course().tone}">${icon(r.format==='pdf'?'work':'book')}</span>${pill(r.format==='pdf'?'PDF':'Հղում')}${pill(r.source==='teacher'?'Ուսուցչից':'Հարթակից','neutral')}</div><h2 style="font-size:18px">${esc(r.title)}</h2><p class="material-meta">${esc(course().name)} · ${esc(course().units[r.unit])}</p><p class="muted small">${esc(r.description)}</p><button class="text-btn" data-material="${r.id}" aria-label="Նախադիտել՝ ${esc(r.title)}">Նախադիտել ${icon('arrow')}</button></article>`).join('')}</div>`:`<section class="card empty">${icon('book')}<h2>${state.scenario==='materials-empty'?'Այս առարկայի համար հավելյալ նյութեր դեռ չկան':'Ընտրված զտիչներով նյութեր չկան'}</h2><p>${state.scenario==='materials-empty'?'Դրանք կհայտնվեն այստեղ, երբ ուսուցիչը կամ հարթակը նյութ տրամադրի։':'Փոխիր թեման, տրամադրողին կամ ձևաչափը՝ մյուս նյութերը տեսնելու համար։'}</p></section>`}
 <p class="footnote">Դիզայնի օրինակ · Նյութերի տրամադրումն ու հրապարակումը դեռ չեն ներդրվել։ Օրինակները իրական դասընթացի նյութեր չեն։</p>`;

function account(){return `${heading('Իմ հաշիվը','Քո մուտքը, դասարաններն ու գաղտնիության ընտրությունները։')}<div class="split"><section class="card"><div class="course-head"><span class="avatar">Ա</span><div><h2>Անի</h2><p class="muted small">Օրինակային սովորող · Հաշիվը նույնն է բոլոր տարիներին</p></div></div><div class="account-list">${[['Մուտք և անվտանգություն','Էլ. հասցե, գաղտնաբառ և վերականգնում','security'],['Իմ դասարանները','Դիտել հասանելի դասարանները կամ միանալ հրավերով','join'],['Գաղտնիություն','Ընտրովի օգտագործման համաձայնություններ և տվյալներ','privacy'],['Հաշվի ջնջման հարցում','Առանձին հաստատում պահանջող գործողություն','deletion'],['Դուրս գալ','Ավարտել ընթացիկ մուտքը','signout']].map(([t,s,a])=>`<div class="account-row"><div><strong>${t}</strong><p>${s}</p></div>${button('Բացել →',a,'text-btn')}</div>`).join('')}</div></section><section class="card"><h3>Քեզ հետ՝ տարեցտարի</h3><p class="muted small" style="margin-top:12px">Ապագա պատմության բաժինը կպահպանի նախկին տարիների արդյունքները։ Տարեկան անցումը կատարվում է դպրոցի կողմից, առանց նոր հաշիվ ստեղծելու։</p><p class="future" style="margin-top:12px">Նախատեսված է · Նախորդ տարիների բաժինը դեռ չի ներդրվել։</p>${past()?button('Նախորդ տարիներ →','history','text-btn'):''}</section></div>`;}
function special(){const spec={empty:['Քո ուսուցումը սկսվում է այստեղ','Հաշիվդ պատրաստ է։ Միացիր քո ուսուցչի դասարանին՝ հրավերով կամ մեկանգամյա կոդով։','Միանալ դասարանին','join','book'],placement:['Դասարանդ դեռ հաստատվում է','Դպրոցը հաստատում է քո տեղաբաշխումը նոր ուսումնական տարում։ Նոր հաշիվ ստեղծելու կամ նորից միանալու կարիք չկա։','Հաշվի տվյալները','account','user'],delivery:['Դասընթացը դեռ պատրաստվում է','Քո դասարանը հաստատված է։ Առարկայի դասարանն ու ծրագիրը դեռ պատրաստ չեն։ Սա քո հաշվի խնդիր չէ։','Հաշվի տվյալները','account','book'],error:['Չհաջողվեց բեռնել դասընթացները','Քո աշխատանքները չեն կորել։ Փորձիր նորից, երբ կապը վերականգնվի։','Փորձել նորից','retry','help'],blocked:['Այս դասընթացի հասանելիությունը դադարեցված է','Հասանելիության հարցով դիմիր քո դպրոցին։ Կարող ես բացել հաշիվդ կամ վերադառնալ մյուս թույլատրված դասընթացներին։','Հաշվի տվյալները','account','lock']};if(state.scenario==='loading')return `${heading('Քո ուսուցումը','Տվյալները բեռնվում են…')}<div aria-busy="true" aria-label="Բեռնվում է"><div class="skeleton"></div><div class="cards" style="margin-top:20px"><div class="skeleton small"></div><div class="skeleton small"></div></div></div>`;const [title,text,cta,action,i]=spec[state.scenario];return `${heading('Իմ ուսուցումը')}<section class="card empty"><span class="subject-icon">${icon(i)}</span><h2>${title}</h2><p>${text}</p>${button(cta,action)}</section>`;}
function focusTask(){return `<div class="focus-task"><div class="section-head">${button('← Վերադառնալ','exit','text-btn')}${pill('Նախադիտում · չի գնահատվում','neutral')}</div><section class="card"><span class="eyebrow">${course().name} · Վարժանք</span><h2>Քո ամբողջ ուշադրությունը՝ մեկ քայլի վրա</h2><p class="muted">Այս հատվածը ցույց է տալիս հանգիստ աշխատանքային տարածքը։ Իրական հարցերը, նյութերն ու պատասխանների ձևերը կմնան գործող ուսումնական համակարգից։</p><div class="notice" style="margin-top:20px">${icon('sound')}<span>Լսելու նյութը և թույլատրված նվագարկումների քանակը ցուցադրվում են այստեղ՝ ըստ առաջադրանքի կանոնների։</span></div><div class="response">${['Օրինակային ընտրություն Ա','Օրինակային ընտրություն Բ','Օրինակային ընտրություն Գ'].map((l,i)=>`<button data-answer="${i}" aria-pressed="false">${l}</button>`).join('')}</div><div class="row" style="margin-top:18px">${button('Հաջորդ քայլը','demo-answer')}${button('Օգնություն','help','btn secondary')}</div></section></div>`;}
function render(focus=false){const previous=document.activeElement;const restore=['coursePicker','materialUnit','materialSource','materialFormat'].includes(previous?.id)?'#'+previous.id:previous?.dataset.filter?'[data-filter="'+previous.dataset.filter+'"]':previous?.dataset.tab?'[data-tab="'+previous.dataset.tab+'"]':null;shell();$('main').innerHTML=state.focus?focusTask():state.page==='account'?account():past()?history():['empty','placement','delivery','error','blocked','loading'].includes(state.scenario)?special():state.page==='home'?home():state.page==='courses'?courseView():state.page==='progress'?heading('Իմ առաջընթացը',course().name+' · '+course().unit,picker())+progressBody():state.page==='work'?work():state.page==='materials'?materials():history();if(focus)$('main').focus();else if(restore)document.querySelector(restore)?.focus();}
function writing(){showDialog('Վերանայել գրավոր աշխատանքը',`<span class="pill amber">Օրինակային սևագիր · միայն այս նախադիտման մեջ</span><p>Ուսուցչի առաջարկը՝ ավելացնել մեկ կոնկրետ օրինակ։</p><label for="draft">Քո պատասխանը</label><textarea id="draft" lang="en" placeholder="Write your revised idea here…">${esc(state.draft)}</textarea><span id="draftStatus" class="muted small">${state.saved?'Օրինակային սևագիրը պահպանված է այս նախադիտման մեջ։':'Ներկայացում չի կատարվում։'}</span><div class="row">${button('Պահել օրինակային սևագիրը','save-draft')}${button('Փակել','close','btn secondary')}</div>`);}
document.addEventListener('change',e=>{if(e.target.id==='scenario'){state.scenario=e.target.value;state.page=past()?'history':state.scenario.startsWith('materials-')?'materials':'home';state.materialUnit='all';state.materialSource='all';state.materialFormat='all';state.course='english';state.focus=false;state.filter='all';state.tab='course';render();}if(e.target.id==='coursePicker'){state.course=e.target.value;state.materialUnit='all';state.materialSource='all';state.materialFormat='all';render();}const materialKeys={materialUnit:'materialUnit',materialSource:'materialSource',materialFormat:'materialFormat'};if(materialKeys[e.target.id]){state[materialKeys[e.target.id]]=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='draft'){state.draft=e.target.value;state.saved=false;$('draftStatus').textContent='Օրինակային փոփոխությունները դեռ չեն պահպանվել։';}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.device){$('frame').classList.toggle('phone',b.dataset.device==='phone');$('frame').classList.toggle('tablet',b.dataset.device==='tablet');document.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}if(b.dataset.page){state.page=b.dataset.page;state.focus=false;render(true);return;}if(b.dataset.select){state.materialUnit='all';state.materialSource='all';state.materialFormat='all';state.course=b.dataset.select;state.page='courses';state.tab='course';render(true);return;}if(b.dataset.tab){state.tab=b.dataset.tab;render();return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}if(b.dataset.answer){document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}if(b.dataset.material){const material=materialRows().find(x=>x.id===b.dataset.material);if(material&&state.scenario!=='materials-unavailable'){showDialog(material.title,`<div class="row">${pill(material.format==='pdf'?'PDF':'Հղում')}${pill(material.source==='teacher'?'Ուսուցչից':'Հարթակից','neutral')}</div><p class="muted small">${esc(course().name)} · ${esc(course().units[material.unit])}</p><p>${esc(material.description)}</p><div class="notice">Սա նյութի քարտի օրինակ է։ Իրական ֆայլ կամ հղում դեռ կցված չէ։</div>${button('Փակել','close','btn secondary')}`);}return;}if(b.dataset.skill!==undefined){const s=skillData()[Number(b.dataset.skill)];showDialog(s[0],`${pill(fresh()?'Տվյալները դեռ բավարար չեն':s[1]==='ready'?'Պատրաստ է':s[1]==='teacher'?'Ուսուցչի գնահատում':'Ամրապնդում է պետք',s[1]==='ready'?'teal':'amber')}<p>${s[2]?'Վիճակը հիմնվում է այս թեմայի վարժանքի տվյալների վրա։ Սա դեռ անկախ ստուգման հաստատում չէ։':'Գրավոր աշխատանքը գնահատվում է առանձին՝ ուսուցչի չափանիշներով։'}</p>${button(s[2]?'Բացել վարժանքը':'Բացել աշխատանքը',s[2]?'focus':'writing','btn',fresh()?'disabled':'')}`);return;}
const a=b.dataset.action;if(!a)return;if(a==='close'){$('dialog').close();return;}if(['home','courses','work','materials','account','history'].includes(a)){state.page=a;if(a==='courses')state.tab='course';render(true);return;}if(a==='assessment'){state.page='courses';state.tab='assessment';render(true);return;}if(a==='focus'||a==='review'){$('dialog').close();state.focus=true;render(true);return;}if(a==='exit'){state.focus=false;render(true);return;}if(a==='retry'){state.scenario='active';$('scenario').value='active';state.page='home';render(true);return;}if(a==='writing'){if($('dialog').open)$('dialog').close();writing();return;}if(a==='save-draft'){state.saved=true;$('draftStatus').textContent='Օրինակային սևագիրը պահպանված է այս նախադիտման մեջ։';return;}if(a==='demo-answer'){toast('Սա դիզայնի օրինակ է․ պատասխան չի ուղարկվել և գնահատական չի հաշվարկվել։');return;}
const dialogs={join:['Միանալ դասարանին','Իրական հարթակում այստեղ կբացվի գործող հրավերի կամ մեկանգամյա կոդի մուտքը։ Այս նախադիտումը հրավեր չի ընդունում և անդամակցություն չի ստեղծում։'],security:['Մուտք և անվտանգություն','Պահպանվում են էլ. հասցեի հաստատումը, գաղտնաբառի փոփոխությունն ու վերականգնումը։ Այս նախադիտումը գաղտնաբառ կամ այլ մուտքային տվյալ չի խնդրում։'],privacy:['Գաղտնիության ընտրություններ','Ընտրովի վերլուծության և հետազոտական օգտագործման համաձայնությունները կմնան առանձին կառավարելի։ Այստեղ համաձայնություն չի փոխվում։'],deletion:['Հաշվի ջնջման հարցում','Գործող հարթակում հարցումն ունի իր հաստատումը և հնարավոր չեղարկումը։ Սա տարբերվում է դասարանից հեռացումից։ Նախադիտումը ջնջման հարցում չի ուղարկում։'],signout:['Դուրս գալ','Իրական հարթակում այս գործողությունն ավարտում է մուտքը և մաքրում հաշվի ցուցադրվող տվյալները։ Նախադիտումը մուտք գործած հաշիվ չունի։'],guide:['Ուսուցման ուղեցույցներ','Այստեղ կբացվեն այս թեմայի հաստատված և հասանելի ուղեցույցները։ Ընթացիկ պաշտպանված ստուգման պատասխանները չեն բացահայտվում։'],help:['Օգնություն վարժանքի ընթացքում','Պահպանվում են հերթական հուշումները և գործող կանոնները։ Ստուգման ժամանակ այս օգնությունը հասանելի չէ։'],rules:['Ստուգման կանոնները','Հարցերի քանակը, գնահատման չափանիշները, հասանելի փորձերն ու լսելու սահմանափակումները ցուցադրվում են ընտրված թեմայի հաստատված կանոններից։ Նախադիտումը ստուգում չի սկսում։'],result:['Յուրացման արդյունքը','Ստուգման արդյունքը և օգտագործված կանոնները ցուցադրվում են այս թեմայի պատմությունից։ Այն չի հավասարեցվում ամբողջ դասընթացի կամ այլ առարկայի յուրացմանը։'],'diagnostic-result':['Ախտորոշիչի արդյունքը','Ախտորոշիչի և հետագա վարժանքի տվյալները ցուցադրվում են առանձին։ Այս օրինակում իրական աշակերտի պատասխաններ չկան։'],'writing-history':['Ներկայացումների պատմություն','Յուրաքանչյուր ներկայացում և ուսուցչի արձագանք պահպանվում են իրենց տարբերակով։ Վերանայումը չի ջնջում նախորդ աշխատանքը։'],'history-detail':['Պահպանված տարվա տվյալները','Դպրոցը, դասարանը, տարին, ծրագրի թողարկումը և սկզբնական գնահատման կանոնները մնում են արդյունքի հետ։ Սա միայն դիտման ապագա օրինակի էջ է։'],pastunit:['Թեմայի պահպանված արդյունքները','Արդյունքներն ու հասանելի նյութերը բացվում են իրենց ճշգրիտ թեմայի և ծրագրի թողարկման շրջանակում։ Սովորողի անցած ճանապարհը չի վերագրվում նոր թեմային։']};if(dialogs[a])showDialog(dialogs[a][0],`<p>${dialogs[a][1]}</p>${button('Փակել','close','btn secondary')}`);
});render();
})();
</script>
