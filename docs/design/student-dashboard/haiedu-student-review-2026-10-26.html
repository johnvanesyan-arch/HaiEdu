let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000);}
function shell(){const future=['grade8','history','placement','delivery'].includes(state.scenario);$('reviewNote').textContent=future?'Ապագա հնարավորության օրինակ · Դեռ չի ներդրվել · Օրինակային տվյալներ':'Օրինակային տվյալներ · Հաշվի տվյալները չեն փոփոխվում';$('context').innerHTML=state.scenario==='empty'?'<strong>Քո հաշիվը պատրաստ է</strong><span>Դասարան դեռ չկա</span>':state.scenario==='placement'?'<strong>2027–2028 ուսումնական տարի</strong><span>Դասարանը դեռ հաստատված չէ</span>':`<strong>${past()?'2025–2026 · 6-րդ դասարան':state.scenario==='grade8'?'2027–2028 · 8-րդ դասարան':'2026–2027 · 7-րդ դասարան'}</strong><span>${state.scenario==='school'?'Օրինակային դպրոց Բ · 7B':'Օրինակային դպրոց Ա · '+(past()?'6A':state.scenario==='grade8'?'8A':'7A')}</span>`;
const items=[...navs,...(past()?[['history','Նախորդ տարիներ','history']]:[])];$('nav').innerHTML=items.map(([id,label,i])=>`<button type="button" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('');$('mobileNav').innerHTML=navs.map(([id,label,i])=>`<button type="button" aria-label="${label}" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${icon(i)}<span>${id==='work'?'Աշխատանք':id==='courses'?'Առարկաներ':id==='materials'?'Նյութեր':label}</span></button>`).join('');$('crumb').textContent=state.focus?'Ուսումնական աշխատանք':([...items,['account','Հաշիվ և գաղտնիություն']].find(n=>n[0]===state.page)?.[1]||'Իմ ուսուցումը');$('frame').classList.toggle('focus',state.focus);$('frame').classList.toggle('calm',state.reducePreviewMotion);}
function subjectArt(kind,hero=false){return `<svg class="${hero?'study-art':'subject-art'}" viewBox="0 0 180 110" aria-hidden="true"><circle cx="91" cy="57" r="43" fill="var(--art)" opacity=".65"/><circle cx="151" cy="25" r="10" fill="#e9bf68"/>${kind==='science'?'<g fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="88" cy="57" rx="51" ry="19"/><ellipse cx="88" cy="57" rx="51" ry="19" transform="rotate(60 88 57)"/><ellipse cx="88" cy="57" rx="51" ry="19" transform="rotate(120 88 57)"/></g><circle cx="88" cy="57" r="8" fill="currentColor"/><circle cx="39" cy="52" r="4" fill="#c89232"/><circle cx="112" cy="21" r="4" fill="currentColor"/>':'<g transform="rotate(-7 90 57)"><rect x="51" y="18" width="73" height="85" rx="8" fill="var(--art)"/><path d="M47 18c17-4 31-1 43 5 13-6 28-9 43-5v68c-15-4-30-2-43 5-12-7-26-9-43-5z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M90 23v68M58 37h21m-21 12h21m-21 12h15m28-24h20m-20 12h20m-20 12h14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" opacity=".5"/></g><path d="M27 65v13m7-20v27m7-15v10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>'}<path d="m25 24 2 6 6 2-6 2-2 6-2-6-6-2 6-2m128 49 2 5 5 2-5 2-2 5-2-5-5-2 5-2" fill="currentColor" opacity=".4"/></svg>`;}
function tile(key){const c=subjects[key],n=readyCount(key);return `<article class="card course-tile ${state.course===key?'selected':''}"><div class="course-art"><span class="course-art-label ${state.course===key?'selected-course':''}">${state.course===key?'Ընտրված դասընթաց':'Բացահայտիր և սովորիր'}</span>${subjectArt(c.visual)}</div><div class="course-card-body"><div class="course-head"><span class="subject-icon ${c.tone}">${icon(c.icon)}</span><div><h3>${c.name}</h3><small>${state.scenario==='grade8'?'8-րդ':'7-րդ'} դասարան · ${state.scenario==='school'?'դպրոց Բ':'դպրոց Ա'}</small></div></div><div><p>${c.label}</p><strong>${c.unit}</strong></div><div><div class="metric-label"><span>Ստուգման պատրաստ հմտություններ</span><strong>${n}/${c.total}</strong></div><div class="bar ${c.tone}" aria-label="${n} պատրաստ հմտություն ${c.total}-ից"><span style="width:${n/c.total*100}%"></span></div></div><div class="tile-foot">${pill(fresh()?'Նախ՝ ախտորոշիչ':key==='english'?'Վարժանքը շարունակվում է':'Ամրապնդում է պետք',fresh()?'amber':key==='english'?'teal':'neutral')}<button class="text-btn" data-select="${key}" aria-label="Բացել ${c.name} դասընթացը">Բացել ${icon('arrow')}</button></div></div></article>`;}
function journey(){const done=state.scenario==='complete',ready=state.scenario==='ready',exhausted=state.scenario==='exhausted';const steps=[['Սկզբնական ախտորոշիչ',fresh()?'Սկսելու առաջին քայլը':'Ավարտված է','check','Տես սկզբնական արդյունքը և այս թեմայի մեկնարկային պահանջները։','assessment'],['Վարժանք և ամրապնդում',fresh()?'Ախտորոշիչից հետո':done?'Կարող ես կրկնել': 'Ընթացքի մեջ է','book','Բացիր հմտությունների քարտեզը՝ տեսնելու, թե ինչն է ամրապնդված և ինչի վրա դեռ աշխատել։','course-progress'],['Յուրացման ստուգում',done?'Ստուգումն անցած է':ready?'Հասանելի է':exhausted?'Փորձերն ավարտված են':'Պատրաստ լինելուց հետո',done?'check':ready?'chart':'lock','Ստուգման հասանելիությունն ու արդյունքները տես գնահատումների բաժնում։','assessment']];return `<div class="card"><div class="section-head"><h2>Քո ուղին այս թեմայում</h2></div><div class="journey">${steps.map(([title,text,i,detail,action],n)=>`<details class="journey-step"><summary><span class="step-mark ${n===(fresh()?0:done||ready||exhausted?2:1)?'current':n>=(fresh()?1:2)&&!done&&!ready?'locked':''}">${icon(i)}</span><span><strong>${title}</strong><small>${text}</small></span>${icon('arrow')}</summary><div class="journey-detail"><p>${detail}</p>${button(action==='course-progress'?'Դիտել հմտությունները →':'Բացել գնահատումները →',action,'text-btn')}</div></details>`).join('')}</div></div>`;}
function feedback(){return `<article class="card feedback"><div class="row"><span class="subject-icon">${icon('mail')}</span>${pill('Վերանայման է վերադարձված','neutral')}</div><h3>Ուսուցչի արձագանքը քեզ է սպասում</h3><p>Անգլերեն · Գրավոր աշխատանք<br>«Ավելացրու մի օրինակ, որը կհիմնավորի քո առաջարկը»։</p>${button('Բացել աշխատանքը →','work','text-btn','data-work-course="english"')}</article>`;}
function home(){if(['empty','placement','delivery','error','blocked','loading'].includes(state.scenario))return special();const c=course(),n=readyCount(),ready=state.scenario==='ready',complete=state.scenario==='complete',exhausted=state.scenario==='exhausted';return `${heading('Ողջո՜ւյն, Անի','Ընտրիր դասընթացը և արա քո հաջորդ քայլը։',picker())}<section class="hero"><div><span class="eyebrow">${icon(fresh()?'book':'spark')}${fresh()?'ՍԿՍԻՐ ԱՅՍՏԵՂԻՑ':complete?'ԵՎՍ ՄԵԿ ՔԱՅԼ ԱՌԱՋ':'ՇԱՐՈՒՆԱԿԻՐ ՈՒՍՈՒՑՈՒՄԸ'}</span><h2>${fresh()?'Ծանոթացիր քո ուժեղ կողմերին':ready?'Պատրաստ ես ստուգել քեզ':complete?'Այս թեմայի ստուգումն անցել ես':exhausted?'Կրկնությամբ ամրապնդիր գիտելիքդ':c.skill}</h2><p>${fresh()?'Սկզբնական ախտորոշիչը կօգնի հասկանալ՝ ինչն արդեն գիտես և ինչին ուշադրություն դարձնել։':complete?'Կարող ես տեսնել արդյունքը կամ վերադառնալ նյութերին։':exhausted?'Նոր ստուգման փորձ հասանելի չէ։ Թեմայի կրկնությունը բաց է։':ready?'Դիտիր այս թեմայի ստուգման կանոնները և սկսիր, երբ պատրաստ լինես։':'Քո վարժանքը պահպանված է։ Շարունակիր այնտեղից, որտեղ կանգ ես առել։'}</p><div class="row">${button(fresh()?'Բացել ախտորոշիչը':ready?'Դիտել ստուգումը':complete?'Դիտել արդյունքը':exhausted?'Կրկնել թեման':'Շարունակել վարժանքը '+icon('arrow'),fresh()||ready||complete?'assessment':exhausted?'review':'focus','btn light')}</div><div class="meta">${c.name} · ${c.label} · ${c.unit}</div></div><div class="hero-visual">${subjectArt(c.visual,true)}<button class="hero-progress" data-action="course-progress" aria-label="Դիտել հմտությունների քարտեզը"><span class="orbit"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" class="ring-track" stroke-width="7"/><circle cx="60" cy="60" r="50" fill="none" class="ring-value" stroke-width="7" stroke-linecap="round" stroke-dasharray="${n/c.total*314} 314"/></svg><span class="ring-text"><strong>${n}<span style="font-size:19px;opacity:.75">/${c.total}</span></strong><small>պատրաստ հմտություն</small></span></span></button><small>Վարժանքի պատրաստվածություն<br>Ստուգման արդյունք չէ</small>${button('Դիտել հմտությունները →','course-progress','text-btn')}</div></section><div class="split home-grid"><section><div class="section-head"><h2>Իմ դասընթացները</h2>${button('Դիտել բոլորը →','courses','text-btn')}</div><div class="cards">${courses().map(tile).join('')}</div></section><aside class="stack">${fresh()?journey():feedback()}${!fresh()?journey():''}</aside></div><div class="notice">${icon('help')}<span>Փորձնական հարթակ · Առարկայական փորձագիտական ստուգումը շարունակվում է։</span></div>`;}
function picker(){return `<label class="small muted">Դասընթաց <select id="coursePicker">${courses().map(k=>`<option value="${k}" ${state.course===k?'selected':''}>${subjects[k].name} · ${state.scenario==='grade8'?8:7}-րդ դասարան</option>`).join('')}</select></label>`;}
function courseView(){const c=course();return `${heading(c.name+' · '+(state.scenario==='grade8'?8:7)+'-րդ դասարան',c.label+' · '+c.unit,picker())}<div class="tabs" aria-label="Դասընթացի բաժիններ">${[['assessment','Գնահատումներ'],['course','Դասընթաց'],['progress','Առաջընթաց']].map(([id,label])=>`<button data-tab="${id}" aria-pressed="${state.tab===id}">${label}</button>`).join('')}</div>${state.tab==='assessment'?assessments():state.tab==='progress'?progressBody():`<div class="split"><section class="card"><div class="section-head"><h2>Ուսուցման քարտեզ</h2>${pill(c.label)}</div><div class="journey">${c.units.map((u,n)=>`<div class="step"><span class="step-mark ${n===(state.course==='english'?2:1)?'current':''}">${n+1}</span><div><strong>${u}</strong><small>${n===(state.course==='english'?2:1)?'Ընթացիկ թեմա':'Նյութեր և պահպանված արդյունքներ'}</small></div>${button(n===(state.course==='english'?2:1)?'Շարունակել':'Դիտել',n===(state.course==='english'?2:1)?'focus':'pastunit','text-btn')}</div>`).join('')}</div></section><section class="stack">${journey()}<div class="card"><h3>Թեմայի նյութերը</h3><p class="muted small">Ուղեցույցներ և գրավոր աշխատանք՝ առանձին բաժիններում։</p><div class="row">${button('Ուղեցույցներ','guide','text-btn')}${button('Գրավոր աշխատանք','work','text-btn')}${button('Հավելյալ նյութեր','materials','text-btn')}</div></div></section></div><div class="notice">${icon('book')}<span>Խոսքը և գործնական ներկայացումները գնահատվում են դասարանում։ Դրանք չեն միավորվում ավտոմատ ստուգման արդյունքին։</span></div>`}`;}
function assessments(){const done=state.scenario==='complete',ready=state.scenario==='ready',exhausted=state.scenario==='exhausted';return `<div class="section-grid"><article class="card"><span class="subject-icon">${icon('chart')}</span><h3>Սկզբնական ախտորոշիչ</h3>${pill(fresh()?'Սկսելու քայլը':'Ավարտված է',fresh()?'amber':'teal')}<p>Ճանաչիր թեմայի քո ուժեղ կողմերն ու սովորելու կարիքները։</p>${button(fresh()?'Դիտել կանոնները':'Դիտել արդյունքը',fresh()?'rules':'diagnostic-result','btn secondary')}</article><article class="card"><span class="subject-icon teal">${icon('check')}</span><h3>Յուրացման ստուգում</h3>${pill(done?'Ստուգումն անցած է':ready?'Հասանելի է':exhausted?'Փորձերն ավարտված են':'Դեռ ամրապնդում է պետք',done?'teal':ready?'':'amber')}<p>${fresh()?'Նախ ավարտիր ախտորոշիչը։':exhausted?'Նոր փորձ չի տրամադրվում։ Կարող ես կրկնել թեման։':'Հասանելիությունը որոշվում է այս թեմայի հմտություններով և ստուգման կանոններով։'}</p>${done?button('Տեսնել արդյունքը','result','btn secondary'):ready?button('Դիտել կանոնները','rules'):button('Սկսել ստուգումը','none','btn','disabled')}</article><article class="card"><span class="subject-icon amber">${icon('history')}</span><h3>Թեմայի կրկնություն</h3><p>Վերադարձիր նյութերին և ամրապնդիր այն, ինչի վրա դեռ աշխատում ես։</p>${button('Բացել կրկնությունը','review','btn secondary',fresh()?'disabled':'')}</article></div><details class="card"><summary>Ինչպե՞ս են հաշվարկվում արդյունքները</summary><p class="muted small">Ախտորոշիչը, վարժանքի պատրաստվածությունը, յուրացման ստուգումն ու ուսուցչի գրավոր գնահատումը առանձին տվյալներ են։ Կիրառվում են ընտրված թեմայի հաստատված կանոնները։</p></details>`;}
function skillData(){return [ ['Բառապաշար և իմաստ','ready',true],['Քերականական կառուցվածքներ','developing',true],['Կարդալ և հասկանալ','ready',true],['Լսել և հասկանալ','developing',true],['Գրել և հիմնավորել','teacher',false] ];}
function progressBody(){const labels={ready:'Պատրաստ է',developing:'Ամրապնդում է պետք',teacher:'Ուսուցչի գնահատում'};return `<div class="section-grid"><div class="card"><span class="muted small">Վարժանքի պատրաստվածություն</span><strong class="stat-number">${readyCount()}/${course().total}</strong><p>Այս թեմայի պահանջվող ավտոմատ հմտությունները</p></div><div class="card"><span class="muted small">Յուրացման ստուգում</span><h3>${state.scenario==='complete'?'Ստուգումն անցած է':'Դեռ հաստատված չէ'}</h3><p>Առանձին ստուգման արդյունք</p></div><div class="card"><span class="muted small">Գրավոր աշխատանք</span><h3>${fresh()?'Դեռ չի ներկայացվել':'Վերանայման փուլում'}</h3><p>Ուսուցչի առանձին արձագանք և գնահատում</p></div></div><div class="section-head"><h2>Հմտությունների քարտեզ</h2><div class="filters" aria-label="Հմտության ֆիլտրեր">${[['all','Բոլորը'],['developing','Ամրապնդել'],['ready','Պատրաստ']].map(([id,l])=>`<button data-filter="${id}" aria-pressed="${state.filter===id}">${l}</button>`).join('')}</div></div><div class="skill-list">${skillData().map(([title,s,automatic],i)=>({title,s,automatic,i})).filter(x=>state.filter==='all'||(!fresh()&&x.s===state.filter)).map(x=>`<button class="skill" data-skill="${x.i}"><span class="skill-num">${String(x.i+1).padStart(2,'0')}</span><span><strong>${x.title}</strong><small>${fresh()?'Տվյալները դեռ բավարար չեն':x.automatic?'Տես հմտության վիճակն ու հաջորդ քայլը':'Առանձին աշխատանք և ուսուցչի արձագանք'}</small></span>${pill(fresh()?'Դեռ չի սկսվել':labels[x.s],x.s==='ready'&&!fresh()?'teal':x.s==='teacher'?'neutral':'amber')}</button>`).join('')}</div><p class="footnote">Նախադիտումը ցույց է տալիս հմտության քարտերի ձևը։ Ամբողջական ցուցակը և չափանիշները կբեռնվեն ընտրված ծրագրից։</p>`;}

function resetMaterialFilters(){state.materialUnit='all';state.materialSource='all';state.materialFormat='all';state.materialPurpose='all';state.materialQuery='';}
function materialRows(){return materialExamples[state.course]||[];}
function materialMatches(){const query=state.materialQuery.normalize('NFC').trim().toLocaleLowerCase('hy');return materialRows().filter(r=>(state.materialUnit==='all'||String(r.unit)===state.materialUnit)&&(state.materialSource==='all'||r.source===state.materialSource)&&(state.materialFormat==='all'||r.format===state.materialFormat)&&(state.materialPurpose==='all'||r.purpose===state.materialPurpose)&&(!query||[r.title,r.goal||'',r.description,course().units[r.unit]].join(' ').normalize('NFC').toLocaleLowerCase('hy').includes(query)));}
function materialSelect(id,label,options){return `<label class="small muted" for="${id}">${label}<select id="${id}">${options.map(([value,text])=>`<option value="${value}" ${state[id]===value?'selected':''}>${esc(text)}</option>`).join('')}</select></label>`;}
function materialTime(r){return Number.isFinite(r.minutes)&&r.minutes>0?`<span class="resource-time" title="Տրամադրողի մոտավոր գնահատականը">${icon('clock')}մոտ ${r.minutes} րոպե</span>`:'';}
function materialPurpose(r){return r.purpose==='practice'?'Վարժանք':r.purpose==='read'?'Ընթերցանություն':'Նյութ';}

function materialCard(r){return `<article class="resource-card" data-material-id="${r.id}"><div class="resource-cover ${r.purpose==='practice'?'practice':'reading'}">${materialArt(r.purpose)}<span class="resource-format">${r.format==='pdf'?'PDF':'Հղում'}</span></div><div class="resource-body"><div class="resource-meta"><span>${materialPurpose(r)}</span>${materialTime(r)}</div><h3>${esc(r.title)}</h3><p class="resource-goal">${esc(r.goal||r.description)}</p><div class="resource-topic">${icon('book')}<span>${esc(course().units[r.unit])}</span></div><div class="resource-provider">${r.featured?`${icon('spark')}<span>${r.source==='teacher'?'Ուսուցչի առաջարկը':'Հարթակի առաջարկը'}</span>`:`${icon(r.source==='teacher'?'user':'check')}<span>${r.source==='teacher'?'Ուսուցչից':'Հարթակից'}</span>`}</div><button class="resource-open" data-material="${r.id}" aria-label="Նախադիտել՝ ${esc(r.title)}">Նախադիտել նյութը ${icon('arrow')}</button></div></article>`;}

function materialFilterCount(){return [state.materialUnit,state.materialSource,state.materialFormat].filter(x=>x!=='all').length;}
function refreshMaterialResults(){if($('materialResults'))$('materialResults').innerHTML=materialResults();if($('materialFilterCount'))$('materialFilterCount').textContent=materialFilterCount()?' ('+materialFilterCount()+')':'';}
function materials(){return `<div class="materials-page">${heading('Հավելյալ նյութեր','Ընտրիր քեզ հետաքրքրող նյութը և փորձիր ինքնուրույն։',picker())}
 <section class="resource-hero"><div><span class="resource-eyebrow">${esc(course().name)} · Քո տեմպով</span><h2>Ամրապնդիր գիտելիքդ,<br>բացահայտիր ավելին։</h2><p>Վարժություններ և ընթերցանություն՝ քո ուսուցչից ու հարթակից։ Ընտրիր այն, ինչի վրա ուզում ես աշխատել։</p><span class="resource-optional">${icon('leaf')}Լրացուցիչ ուսուցում՝ քո ցանկությամբ</span></div>${materialArt('read',true)}</section>
 <section class="resource-discovery" aria-label="Գտնել հավելյալ նյութեր"><div class="resource-search" role="search"><label class="sr" for="materialSearch">Որոնել հավելյալ նյութերում</label>${icon('search')}<input type="search" id="materialSearch" maxlength="120" autocomplete="off" placeholder="Որոնել նյութ կամ թեմա…" value="${esc(state.materialQuery)}"></div><div class="resource-toolbar"><div class="purpose-chips" aria-label="Նյութի նպատակը">${[['all','Բոլորը','book'],['practice','Վարժանք','work'],['read','Ընթերցանություն','leaf']].map(([key,label,i])=>`<button type="button" data-material-purpose="${key}" aria-pressed="${state.materialPurpose===key}">${icon(i)}${label}</button>`).join('')}</div><details id="materialFilterDetails" class="resource-filter-panel"><summary>${icon('sliders')}Զտիչներ<span id="materialFilterCount">${materialFilterCount()?' ('+materialFilterCount()+')':''}</span></summary><div class="material-filters">${materialSelect('materialUnit','Թեմա',[['all','Բոլոր թեմաները'],...course().units.map((u,i)=>[String(i),u])])}${materialSelect('materialSource','Ով է տրամադրել',[['all','Բոլորը'],['teacher','Ուսուցչից'],['platform','Հարթակից']])}${materialSelect('materialFormat','Ձևաչափ',[['all','Բոլորը'],['pdf','PDF'],['link','Հղում']])}</div></details></div></section>
 <section id="materialResults" aria-label="Հավելյալ նյութերի ցանկ">${materialResults()}</section>
 <p class="resource-footnote">${icon('help')}Նյութը բացելը կամ ներբեռնելը չի փոխում գնահատականդ։ Պարտադիր առաջադրանքները «Իմ աշխատանքները» բաժնում են։</p><p class="footnote">Դիզայնի օրինակ · Նյութերը, առաջարկները և տևողությունները օրինակային են։ Իրական ֆայլեր դեռ կցված չեն։</p></div>`;}
function showMaterial(r){showDialog(r.title,`<div class="materials-dialog"><div class="resource-cover ${r.purpose==='practice'?'practice':'reading'}">${materialArt(r.purpose)}<span class="resource-format">${r.format==='pdf'?'PDF':'Հղում'}</span></div><div class="resource-meta"><span>${materialPurpose(r)} · ${r.source==='teacher'?'Ուսուցչից':'Հարթակից'}</span>${materialTime(r)}</div><div><h3>Ինչի՞ վրա կաշխատես</h3><p>${esc(r.goal||r.description)}</p></div><p class="muted small">${esc(course().name)} · ${esc(course().units[r.unit])}</p>${r.minutes?'<p class="muted small">Տևողությունը տրամադրողի մոտավոր գնահատականն է։ Աշխատիր քեզ հարմար տեմպով։</p>':''}<div class="notice">Սա նյութի նախադիտման օրինակ է։ Իրական ֆայլ կամ հղում դեռ կցված չէ։</div>${button('Փակել','close','btn secondary')}</div>`);}
function history(){return `${heading('Նախորդ տարիներ','Պահպանված արդյունքներ՝ իրենց սկզբնական ուսումնական տարով։',pill('Միայն դիտում','neutral'))}<div class="notice amber">${icon('history')}<span>Ապագա բաժնի նախադիտում · Այս պատմության օրինակը իրական հաշվի տվյալ չէ։</span></div><article class="card"><div class="section-head"><div><h2>2025–2026 · 6-րդ դասարան</h2><p class="muted small">Օրինակային դպրոց Ա · 6A</p></div>${pill('Արխիվ','neutral')}</div><div class="account-list"><div class="account-row"><div><strong>Անգլերեն · Պահպանված աշխատանքներ</strong><p>Սկզբնական ծրագրի թողարկում 1 · սկզբնական գնահատման կանոններ</p></div>${button('Դիտել','history-detail','btn secondary')}</div></div></article><p class="muted small">Նախորդ տարվա արդյունքները չեն հաշվարկվում որպես ընթացիկ տարվա յուրացում։ Այստեղ աշխատանք սկսել կամ փոխել հնարավոր չէ։</p>`;}
function account(){return `${heading('Իմ հաշիվը','Քո մուտքը, դասարաններն ու գաղտնիության ընտրությունները։')}<div class="split"><section class="card"><div class="course-head"><span class="avatar">Ա</span><div><h2>Անի</h2><p class="muted small">Օրինակային սովորող · Հաշիվը նույնն է բոլոր տարիներին</p></div></div><div class="account-actions">${button(icon('exit')+'Դուրս գալ','signout','btn secondary')}</div><div class="account-list">${[['Մուտք և անվտանգություն','Էլ. հասցե, գաղտնաբառ և վերականգնում','security'],['Իմ դասարանները','Դիտել հասանելի դասարանները կամ միանալ հրավերով','join'],['Գաղտնիություն','Ընտրովի օգտագործման համաձայնություններ և տվյալներ','privacy'],['Հաշվի ջնջման հարցում','Առանձին հաստատում պահանջող գործողություն','deletion']].map(([t,s,a])=>`<div class="account-row"><div><strong>${t}</strong><p>${s}</p></div>${button('Բացել →',a,'text-btn')}</div>`).join('')}</div></section><section class="card"><h3>Քեզ հետ՝ տարեցտարի</h3><p class="muted small" style="margin-top:12px">Ապագա պատմության բաժինը կպահպանի նախկին տարիների արդյունքները։ Տարեկան անցումը կատարվում է դպրոցի կողմից, առանց նոր հաշիվ ստեղծելու։</p><p class="future" style="margin-top:12px">Նախատեսված է · Նախորդ տարիների բաժինը դեռ չի ներդրվել։</p>${past()?button('Նախորդ տարիներ →','history','text-btn'):''}</section></div>`;}
function special(){const spec={empty:['Քո ուսուցումը սկսվում է այստեղ','Հաշիվդ պատրաստ է։ Միացիր քո ուսուցչի դասարանին՝ հրավերով կամ մեկանգամյա կոդով։','Միանալ դասարանին','join','book'],placement:['Դասարանդ դեռ հաստատվում է','Դպրոցը հաստատում է քո տեղաբաշխումը նոր ուսումնական տարում։ Նոր հաշիվ ստեղծելու կամ նորից միանալու կարիք չկա։','Հաշվի տվյալները','account','user'],delivery:['Դասընթացը դեռ պատրաստվում է','Քո դասարանը հաստատված է։ Առարկայի դասարանն ու ծրագիրը դեռ պատրաստ չեն։ Սա քո հաշվի խնդիր չէ։','Հաշվի տվյալները','account','book'],error:['Չհաջողվեց բեռնել դասընթացները','Քո աշխատանքները չեն կորել։ Փորձիր նորից, երբ կապը վերականգնվի։','Փորձել նորից','retry','help'],blocked:['Այս դասընթացի հասանելիությունը դադարեցված է','Հասանելիության հարցով դիմիր քո դպրոցին։ Կարող ես բացել հաշիվդ կամ վերադառնալ մյուս թույլատրված դասընթացներին։','Հաշվի տվյալները','account','lock']};if(state.scenario==='loading')return `${heading('Քո ուսուցումը','Տվյալները բեռնվում են…')}<div aria-busy="true" aria-label="Բեռնվում է"><div class="skeleton"></div><div class="cards" style="margin-top:20px"><div class="skeleton small"></div><div class="skeleton small"></div></div></div>`;const [title,text,cta,action,i]=spec[state.scenario];return `${heading('Իմ ուսուցումը')}<section class="card empty"><span class="subject-icon">${icon(i)}</span><h2>${title}</h2><p>${text}</p>${button(cta,action)}</section>`;}
function focusTask(){return `<div class="focus-task"><div class="section-head">${button('← Վերադառնալ','exit','text-btn')}${pill('Նախադիտում · չի գնահատվում','neutral')}</div><section class="card"><span class="eyebrow">${course().name} · Վարժանք</span><h2>Քո ամբողջ ուշադրությունը՝ մեկ քայլի վրա</h2><p class="muted">Այս հատվածը ցույց է տալիս հանգիստ աշխատանքային տարածքը։ Իրական հարցերը, նյութերն ու պատասխանների ձևերը կմնան գործող ուսումնական համակարգից։</p><div class="notice" style="margin-top:20px">${icon('sound')}<span>Լսելու նյութը և թույլատրված նվագարկումների քանակը ցուցադրվում են այստեղ՝ ըստ առաջադրանքի կանոնների։</span></div><div class="response">${['Օրինակային ընտրություն Ա','Օրինակային ընտրություն Բ','Օրինակային ընտրություն Գ'].map((l,i)=>`<button data-answer="${i}" aria-pressed="false">${l}</button>`).join('')}</div><div class="row" style="margin-top:18px">${button('Հաջորդ քայլը','demo-answer')}${button('Օգնություն','help','btn secondary')}</div></section></div>`;}
function render(focus=false){const previous=document.activeElement;const restore=['coursePicker','materialUnit','materialSource','materialFormat'].includes(previous?.id)?'#'+previous.id:previous?.dataset.filter?'[data-filter="'+previous.dataset.filter+'"]':previous?.dataset.tab?'[data-tab="'+previous.dataset.tab+'"]':null;shell();$('main').innerHTML=state.focus?focusTask():state.page==='account'?account():past()?history():['empty','placement','delivery','error','blocked','loading'].includes(state.scenario)?special():state.page==='home'?home():state.page==='courses'?courseView():state.page==='work'?work():state.page==='materials'?materials():history();if(focus)$('main').focus();else if(restore)document.querySelector(restore)?.focus();}
function writing(){showDialog('Վերանայել գրավոր աշխատանքը',`<span class="pill amber">Օրինակային սևագիր · միայն այս նախադիտման մեջ</span><p>Ուսուցչի առաջարկը՝ ավելացնել մեկ կոնկրետ օրինակ։</p><label for="draft">Քո պատասխանը</label><textarea id="draft" lang="en" placeholder="Write your revised idea here…">${esc(state.draft)}</textarea><span id="draftStatus" class="muted small">${state.saved?'Օրինակային սևագիրը պահպանված է այս նախադիտման մեջ։':'Ներկայացում չի կատարվում։'}</span><div class="row">${button('Պահել օրինակային սևագիրը','save-draft')}${button('Փակել','close','btn secondary')}</div>`);}
document.addEventListener('change',e=>{if(e.target.id==='reducePreviewMotion'){state.reducePreviewMotion=e.target.checked;$('frame').classList.toggle('calm',state.reducePreviewMotion);return;}if(e.target.id==='scenario'){state.scenario=e.target.value;state.page=past()?'history':state.scenario.startsWith('materials-')?'materials':'home';resetMaterialFilters();state.course='english';state.focus=false;state.filter='all';state.tab='course';render();}if(e.target.id==='coursePicker'){state.course=e.target.value;resetMaterialFilters();render();}const materialKeys={materialUnit:'materialUnit',materialSource:'materialSource',materialFormat:'materialFormat'};if(materialKeys[e.target.id]){state[materialKeys[e.target.id]]=e.target.value;refreshMaterialResults();}});
document.addEventListener('input',e=>{if(e.target.id==='materialSearch'){state.materialQuery=e.target.value;refreshMaterialResults();return;}if(e.target.id==='draft'){state.draft=e.target.value;state.saved=false;$('draftStatus').textContent='Օրինակային փոփոխությունները դեռ չեն պահպանվել։';}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.device){$('frame').classList.toggle('phone',b.dataset.device==='phone');$('frame').classList.toggle('tablet',b.dataset.device==='tablet');document.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}if(b.dataset.page){state.page=b.dataset.page;state.focus=false;render(true);return;}if(b.dataset.select){resetMaterialFilters();state.course=b.dataset.select;state.page='courses';state.tab='course';render(true);return;}if(b.dataset.tab){state.tab=b.dataset.tab;render();return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}if(b.dataset.answer){document.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}if(b.dataset.materialPurpose){state.materialPurpose=b.dataset.materialPurpose;document.querySelectorAll('[data-material-purpose]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.materialPurpose===state.materialPurpose)));refreshMaterialResults();return;}if(b.dataset.material){const material=materialRows().find(x=>x.id===b.dataset.material);if(material&&state.scenario!=='materials-unavailable'){showMaterial(material);}return;}if(b.dataset.skill!==undefined){const s=skillData()[Number(b.dataset.skill)];showDialog(s[0],`${pill(fresh()?'Տվյալները դեռ բավարար չեն':s[1]==='ready'?'Պատրաստ է':s[1]==='teacher'?'Ուսուցչի գնահատում':'Ամրապնդում է պետք',s[1]==='ready'?'teal':'amber')}<p>${s[2]?'Վիճակը հիմնվում է այս թեմայի վարժանքի տվյալների վրա։ Սա դեռ անկախ ստուգման հաստատում չէ։':'Գրավոր աշխատանքը գնահատվում է առանձին՝ ուսուցչի չափանիշներով։'}</p>${button(s[2]?'Բացել վարժանքը':'Բացել աշխատանքը',s[2]?'focus':'writing','btn',fresh()?'disabled':'')}`);return;}
const a=b.dataset.action;if(!a)return;if(a==='clear-material-filters'){resetMaterialFilters();render();$('materialSearch')?.focus();return;}if(a==='close'){$('dialog').close();return;}if(['home','courses','work','materials','account','history'].includes(a)){if(a==='work'&&b.dataset.workCourse&&courses().includes(b.dataset.workCourse)){state.course=b.dataset.workCourse;resetMaterialFilters();}state.page=a;if(a==='courses')state.tab='course';render(true);return;}if(a==='course-progress'){state.page='courses';state.tab='progress';render(true);return;}if(a==='assessment'){state.page='courses';state.tab='assessment';render(true);return;}if(a==='focus'||a==='review'){$('dialog').close();state.focus=true;render(true);return;}if(a==='exit'){state.focus=false;render(true);return;}if(a==='retry'){state.scenario='active';$('scenario').value='active';state.page='home';render(true);return;}if(a==='writing'){if($('dialog').open)$('dialog').close();writing();return;}if(a==='save-draft'){state.saved=true;$('draftStatus').textContent='Օրինակային սևագիրը պահպանված է այս նախադիտման մեջ։';return;}if(a==='demo-answer'){toast('Սա դիզայնի օրինակ է․ պատասխան չի ուղարկվել և գնահատական չի հաշվարկվել։');return;}
const dialogs={join:['Միանալ դասարանին','Իրական հարթակում այստեղ կբացվի գործող հրավերի կամ մեկանգամյա կոդի մուտքը։ Այս նախադիտումը հրավեր չի ընդունում և անդամակցություն չի ստեղծում։'],security:['Մուտք և անվտանգություն','Պահպանվում են էլ. հասցեի հաստատումը, գաղտնաբառի փոփոխությունն ու վերականգնումը։ Այս նախադիտումը գաղտնաբառ կամ այլ մուտքային տվյալ չի խնդրում։'],privacy:['Գաղտնիության ընտրություններ','Ընտրովի վերլուծության և հետազոտական օգտագործման համաձայնությունները կմնան առանձին կառավարելի։ Այստեղ համաձայնություն չի փոխվում։'],deletion:['Հաշվի ջնջման հարցում','Գործող հարթակում հարցումն ունի իր հաստատումը և հնարավոր չեղարկումը։ Սա տարբերվում է դասարանից հեռացումից։ Նախադիտումը ջնջման հարցում չի ուղարկում։'],signout:['Դուրս գալ','Իրական հարթակում այս գործողությունն ավարտում է մուտքը և մաքրում հաշվի ցուցադրվող տվյալները։ Նախադիտումը մուտք գործած հաշիվ չունի։'],guide:['Ուսուցման ուղեցույցներ','Այստեղ կբացվեն այս թեմայի հաստատված և հասանելի ուղեցույցները։ Ընթացիկ պաշտպանված ստուգման պատասխանները չեն բացահայտվում։'],help:['Օգնություն վարժանքի ընթացքում','Պահպանվում են հերթական հուշումները և գործող կանոնները։ Ստուգման ժամանակ այս օգնությունը հասանելի չէ։'],rules:['Ստուգման կանոնները','Հարցերի քանակը, գնահատման չափանիշները, հասանելի փորձերն ու լսելու սահմանափակումները ցուցադրվում են ընտրված թեմայի հաստատված կանոններից։ Նախադիտումը ստուգում չի սկսում։'],result:['Յուրացման արդյունքը','Ստուգման արդյունքը և օգտագործված կանոնները ցուցադրվում են այս թեմայի պատմությունից։ Այն չի հավասարեցվում ամբողջ դասընթացի կամ այլ առարկայի յուրացմանը։'],'diagnostic-result':['Ախտորոշիչի արդյունքը','Ախտորոշիչի և հետագա վարժանքի տվյալները ցուցադրվում են առանձին։ Այս օրինակում իրական աշակերտի պատասխաններ չկան։'],'writing-history':['Ներկայացումների պատմություն','Յուրաքանչյուր ներկայացում և ուսուցչի արձագանք պահպանվում են իրենց տարբերակով։ Վերանայումը չի ջնջում նախորդ աշխատանքը։'],'history-detail':['Պահպանված տարվա տվյալները','Դպրոցը, դասարանը, տարին, ծրագրի թողարկումը և սկզբնական գնահատման կանոնները մնում են արդյունքի հետ։ Սա միայն դիտման ապագա օրինակի էջ է։'],pastunit:['Թեմայի պահպանված արդյունքները','Արդյունքներն ու հասանելի նյութերը բացվում են իրենց ճշգրիտ թեմայի և ծրագրի թողարկման շրջանակում։ Սովորողի անցած ճանապարհը չի վերագրվում նոր թեմային։']};if(dialogs[a])showDialog(dialogs[a][0],`<p>${dialogs[a][1]}</p>${button('Փակել','close','btn secondary')}`);
});render();
})();
