<script>
(()=>{

let page='home',state='active',filter='all',lastFocus=null;
const skills=[
 {name:'Ֆիզիկական երևույթների ճանաչում',value:92,kind:'ready',answers:12},
 {name:'Ֆիզիկական մարմիններ և նյութեր',value:88,kind:'ready',answers:10},
 {name:'Դիտում և փորձ',value:84,kind:'ready',answers:9},
 {name:'Չափման գործիքների ընտրություն',value:62,kind:'work',answers:8},
 {name:'Չափման միավորներ',value:58,kind:'work',answers:8},
 {name:'Սանդղակի բաժանման արժեք',value:47,kind:'work',answers:6},
 {name:'Երկարության չափում',value:40,kind:'work',answers:5},
 {name:'Ժամանակի չափում',value:null,kind:'new',answers:0},
 {name:'Չափման արդյունքի գրանցում',value:null,kind:'new',answers:0},
 {name:'Չափման ճշտություն',value:null,kind:'new',answers:0}
];

const status=kind=>kind==='ready'?'<span class="hd-pill teal">✓ Պատրաստ է ստուգման</span>':kind==='work'?'<span class="hd-pill amber">Ամրապնդում է պետք</span>':'<span class="hd-pill neutral">Դեռ չեք սկսել</span>';
const ring=(n,total,caption)=>`<div class="hd-ring" role="img" aria-label="${n}՝ ${total}-ից, ${caption}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="49" fill="none" stroke="#ffffff25" stroke-width="7"/><circle cx="60" cy="60" r="49" fill="none" stroke="#9be1ce" stroke-width="7" stroke-linecap="round" stroke-dasharray="${n/total*307.876} 307.876"/></svg><strong>${n}<small>${total}-ից ${caption}</small></strong></div>`;
const heading=(title,sub)=>`<div class="hd-page-heading"><div><h1>${title}</h1><p>${sub}</p></div>${state!=='empty'?`<span class="hd-subject-pill">${ico('atom')}Ֆիզիկա · 7</span>`:''}</div>`;
const stats=()=>`<section class="hd-stats" aria-label="Ուսուցման տարբեր ցուցանիշներ"><article class="hd-stat"><span class="hd-stat-label">${ico('clipboard-check')}Ելակետային ախտորոշիչ</span><strong>80<span style="font-size:15px">%</span></strong><p>16 / 20 ճիշտ պատասխան</p><div class="hd-mini-bar"><span style="width:80%"></span></div></article><article class="hd-stat"><span class="hd-stat-label">${ico('blocks')}Պատրաստ են ստուգման</span><strong>3 <span style="font-size:14px;color:var(--hd-muted)">/ 10</span></strong><p>Գլուխ I-ի հմտություններից</p><div class="hd-segment-bar" aria-label="10 հմտությունից 3-ը պատրաստ են ստուգման">${Array.from({length:10},(_,i)=>`<span class="${i<3?'hd-filled':''}"></span>`).join('')}</div></article><article class="hd-stat"><span class="hd-stat-label">${ico('shield-check')}Գլխի յուրացում</span><strong class="hd-status-value">Դեռ չի հաստատվել</strong><p>Հաստատվում է յուրացման ստուգմամբ</p></article></section>`;
const courseCard=()=>`<article class="hd-panel hd-course-card"><div class="hd-course-title"><span class="hd-subject-icon">${ico('atom')}</span><div><h3>Ֆիզիկա · 7-րդ դասարան</h3><p>7Ա դասարան · 2026–2027</p></div></div><div class="hd-unit-label">ԳԼՈՒԽ I</div><h3>Բնության ուսումնասիրության ֆիզիկական մեթոդները</h3><div class="hd-course-progress"><div><span>Ստուգման պատրաստ հմտություններ</span><strong>${state==='active'?'3 / 10':'—'}</strong></div><div class="hd-bar"><span style="width:${state==='active'?30:0}%;background:var(--hd-teal)"></span></div></div><div class="hd-course-bottom"><span class="hd-pill ${state==='active'?'blue':'neutral'}">${state==='active'?'Ուսուցումն ընթացքի մեջ է':'Սկսեք ախտորոշիչից'}</span><button class="hd-text-button" type="button" data-page="progress">Դիտել ${ico('arrow-up-right')}</button></div></article>`;
const timeline=()=>`<div class="hd-timeline"><div class="hd-event"><span class="hd-event-icon">${ico('play')}</span><div><strong>Վարժանքն ընթացքի մեջ է</strong><p>5 / 8 հարցի պատասխանել եք</p><small>Այսօր</small></div></div><div class="hd-event"><span class="hd-event-icon teal">${ico('check')}</span><div><strong>Վարժանքն ավարտված է</strong><p>6 / 8 ճիշտ պատասխան · 75%</p><small>Հոկտեմբերի 5</small></div></div><div class="hd-event"><span class="hd-event-icon teal">${ico('check')}</span><div><strong>Ախտորոշիչն ավարտված է</strong><p>16 / 20 ճիշտ պատասխան · 80%</p><small>Հոկտեմբերի 1</small></div></div></div>`;
function activeHome(){return heading('Բարի վերադարձ, Անի','Շարունակեք այնտեղից, որտեղ կանգ եք առել։')+`<section class="hd-hero"><div><span class="hd-kicker">ՀԱՋՈՐԴ ՔԱՅԼԸ · ՖԻԶԻԿԱ 7</span><h2>Շարունակենք վարժանքը</h2><p>Մնացել է 3 հարց։ Ձեր պատասխանները պահպանված են։</p></div><div class="hd-hero-ring">${ring(5,8,'հարց')}<small>Ընթացիկ վարժանք</small></div><button class="hd-primary" type="button" data-action="resume">Շարունակել վարժանքը ${ico('arrow-right')}</button></section>`+stats()+`<div class="hd-lower-grid"><section><div class="hd-section-top"><h2>Իմ դասընթացները</h2></div>${courseCard()}</section><section><div class="hd-section-top"><h2>Վերջին քայլերը</h2></div>${timeline()}</section></div>`;}
function steps(){return `<section><div class="hd-section-top"><h2>Ձեր առաջին քայլերը</h2></div><div class="hd-first-steps"><article class="hd-step ${state==='empty'?'current':'done'}"><span class="hd-step-number">${state==='empty'?'1':'✓'}</span><h3>Միանալ դասարանին</h3><p>${state==='empty'?'Ուսուցչի հրավերով կամ կոդով։':'Դուք միացել եք 7Ա դասարանին։'}</p></article><article class="hd-step ${state==='fresh'?'current':''}"><span class="hd-step-number">2</span><h3>Անցնել ախտորոշիչը</h3><p>Պարզեք՝ ինչ գիտեք և որտեղից սկսել։</p></article><article class="hd-step"><span class="hd-step-number">3</span><h3>Սկսել վարժանքը</h3><p>Բացվում է ախտորոշիչից հետո։</p></article></div></section>`;}
function newHome(){const empty=state==='empty';return heading('Բարի գալուստ, Անի','Ձեր ուսուցման ճանապարհը սկսվում է այստեղ։')+`<section class="hd-hero"><div><span class="hd-kicker">${empty?'ԱՌԱՋԻՆ ՔԱՅԼԸ':'ՖԻԶԻԿԱ 7 · ԳԼՈՒԽ I'}</span><h2>${empty?'Միացեք ձեր դասարանին':'Սկսենք ձեր մեկնարկային մակարդակից'}</h2><p>${empty?'Օգտագործեք ուսուցչի ուղարկած հրավերը կամ դասարանի կոդը։':'Ախտորոշիչը կօգնի որոշել՝ որ հմտություններն ամրապնդել։'}</p></div><div class="hd-hero-ring">${ring(empty?0:1,3,'քայլ')}</div><button class="hd-primary" type="button" data-action="${empty?'join':'diagnostic'}">${empty?'Միանալ դասարանին':'Սկսել ախտորոշիչը'} ${ico('arrow-right')}</button></section>`+steps()+(empty?`<section class="hd-empty-panel"><span class="hd-empty-symbol">${ico('book-open')}</span><h2>Ձեր առարկաները կլինեն այստեղ</h2><p>Դասարանին միանալուց հետո կտեսնեք հասանելի դասընթացներն ու ձեր հաջորդ քայլը։</p></section>`:`<section><div class="hd-section-top"><h2>Իմ դասընթացները</h2></div>${courseCard()}</section>`);}
function skillRows(){return skills.map((s,i)=>({...s,index:i})).filter(s=>filter==='all'||s.kind===filter).map(s=>`<article class="hd-skill" data-kind="${s.kind}"><div class="hd-skill-name"><span class="hd-skill-number">${String(s.index+1).padStart(2,'0')}</span><div><h3>${s.name}</h3>${status(s.kind)}</div></div><div class="hd-skill-meter"><div class="hd-meter-label"><span>Վարժանք</span><strong>${s.value===null?'—':s.value+'%'}</strong></div><div class="hd-bar" aria-label="${s.value===null?'Տվյալներ դեռ չկան':'Վարժանքի ցուցանիշ՝ '+s.value+' տոկոս'}"><span style="width:${s.value||0}%"></span></div></div><button class="hd-arrow" type="button" data-skill="${s.index}" aria-label="${s.name}․ մանրամասներ">${ico('chevron-right')}</button></article>`).join('');}
function progress(){if(state!=='active')return heading('Իմ առաջընթացը','Ֆիզիկա · 7-րդ դասարան')+`<section class="hd-empty-panel"><span class="hd-empty-symbol">${ico('chart-no-axes-combined')}</span><h2>Առաջընթացի տվյալներ դեռ չկան</h2><p>${state==='empty'?'Նախ միացեք ձեր դասարանին։ Արդյունքները կհայտնվեն առաջին աշխատանքից հետո։':'Սկսեք ախտորոշիչից։ Դրանից հետո այստեղ կտեսնեք ձեր մեկնարկային արդյունքն ու հմտությունների զարգացումը։'}</p><button class="hd-primary" type="button" data-action="${state==='empty'?'join':'diagnostic'}">${state==='empty'?'Միանալ դասարանին':'Սկսել ախտորոշիչը'} ${ico('arrow-right')}</button></section>`+steps();return heading('Տեսեք՝ ինչպես եք առաջ շարժվում','Ֆիզիկա 7 · Բնության ուսումնասիրության ֆիզիկական մեթոդները')+stats()+`<section class="hd-panel"><div class="hd-progress-intro"><div><h2>Հմտությունների պատկերը</h2><p>Վարժանքի ցուցանիշը և ստուգման պատրաստությունը ներկայացված են առանձին։</p></div></div><div class="hd-breakdown"><div><strong>3</strong><span class="hd-dot teal"></span>Պատրաստ են ստուգման</div><div><strong>4</strong><span class="hd-dot amber"></span>Ամրապնդում են պահանջում</div><div><strong>3</strong><span class="hd-dot"></span>Դեռ չեք սկսել</div></div><div class="hd-filter-row" aria-label="Հմտությունների զտում">${[['all','Բոլորը · 10'],['work','Ամրապնդել · 4'],['ready','Պատրաստ · 3'],['new','Չսկսված · 3']].map(([k,l])=>`<button type="button" class="hd-filter" data-filter="${k}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div><div id="hd-skills">${skillRows()}</div></section><details class="hd-proof"><summary>Ինչպե՞ս կարդալ այս ցուցանիշները</summary><p>Ախտորոշիչը ցույց է տալիս մեկնարկային արդյունքը։ Վարժանքի ցուցանիշը նկարագրում է ընթացիկ ուսումնական տվյալները։ Գլխի յուրացումը հաստատվում է առանձին ստուգմամբ։</p></details><section><div class="hd-section-top"><h2>Վերջին աշխատանքները</h2></div>${timeline()}</section>`;}
function icons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});}
function render(){main.innerHTML=page==='home'?(state==='active'?activeHome():newHome()):progress();root.querySelector('#hd-breadcrumb').textContent=page==='home'?'Իմ ուսուցումը':'Ֆիզիկա 7 / Առաջընթաց';root.querySelector('#hd-year').textContent=state==='empty'?'Նոր սովորող':'2026–2027 · 7Ա';root.querySelector('#hd-course-nav').hidden=state==='empty';root.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('hd-current',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});icons();}
function openModal(content){lastFocus=document.activeElement;dialog.innerHTML=content;overlay.hidden=false;root.querySelector('.hd-app').inert=true;icons();root.querySelector('.hd-close').focus();}
function closeModal(){overlay.hidden=true;root.querySelector('.hd-app').inert=false;if(lastFocus?.isConnected)lastFocus.focus();}
const title=(k,t)=>`<span class="hd-kicker">${k}</span><h2 id="hd-dialog-title">${t}</h2>`;
function action(name){if(name==='close'){closeModal();return;}if(name==='join'){openModal(title('ԴԱՍԱՐԱՆԻ ՀՐԱՎԵՐ','Միանալ դասարանին')+`<p>Մուտքագրեք ձեր ուսուցչի ուղարկած կոդը։</p><label for="hd-code">Դասարանի կոդը<input id="hd-code" value="DEMO-7A" autocomplete="off" spellcheck="false" /></label><button class="hd-primary" type="button" data-action="demo-join">Դիտել միանալուց հետո ${ico('arrow-right')}</button><p style="margin-top:14px;font-size:11px">Նախադիտման օրինակ․ իրական միացում չի կատարվում։</p>`);return;}if(name==='demo-join'){closeModal();state='fresh';root.querySelector('#hd-state').value=state;page='home';render();return;}if(name==='account'){openModal(title('ՀԱՇԻՎ','Անի · Սովորող')+'<p>Նախադիտման օրինակային հաշիվ։</p><dl><div><dt>Դեր</dt><dd>Սովորող</dd></div><div><dt>Միջերեսի լեզու</dt><dd>Հայերեն</dd></div></dl>');return;}if(name==='resume'){openModal(title('ԸՆԹԱՑԻԿ ՎԱՐԺԱՆՔ','Շարունակել սովորելը')+'<p>Ֆիզիկա 7 · Գլուխ I</p><dl><div><dt>Պատասխանված հարցեր</dt><dd>5 / 8</dd></div><div><dt>Մնացած հարցեր</dt><dd>3</dd></div></dl><p>Վարժանքը շարունակվում է հաջորդ անպատասխան հարցից։</p><span class="hd-pill blue">Դիզայնի նախադիտում</span>');return;}if(name==='diagnostic'){openModal(title('ԵԼԱԿԵՏԱՅԻՆ ԱԽՏՈՐՈՇԻՉ','Պարզենք՝ որտեղից սկսել')+'<p>Ֆիզիկա 7 · Գլուխ I</p><dl><div><dt>Հարցերի քանակ</dt><dd>20</dd></div><div><dt>Նպատակ</dt><dd>Մեկնարկային մակարդակ</dd></div></dl><p>Ախտորոշիչն ավարտելուց հետո կբացվի վարժանքը։</p><span class="hd-pill blue">Դիզայնի նախադիտում</span>');return;}if(state==='empty'){action('join');return;}if(name==='assessment'){openModal(title('ԳՆԱՀԱՏՈՒՄՆԵՐ','Ուսուցման տարբեր փուլերը')+`<dl><div><dt>Ախտորոշիչ</dt><dd>${state==='active'?'Ավարտված · 80%':'Դեռ չեք սկսել'}</dd></div><div><dt>Վարժանք</dt><dd>${state==='active'?'Ընթացքի մեջ · 5/8':'Ախտորոշիչից հետո'}</dd></div><div><dt>Յուրացման ստուգում</dt><dd>Դեռ հասանելի չէ</dd></div></dl><button class="hd-primary" type="button" data-action="${state==='active'?'resume':'diagnostic'}">${state==='active'?'Շարունակել վարժանքը':'Սկսել ախտորոշիչը'} ${ico('arrow-right')}</button>`);return;}if(name==='course'){openModal(title('ՖԻԶԻԿԱ 7 · ԳԼՈՒԽ I','Բնության ուսումնասիրության ֆիզիկական մեթոդները')+'<p>10 հմտություն · Դասարանի հասանելի ուսումնական բաժինը</p><button type="button" class="hd-primary" data-action="show-progress">Դիտել հմտությունները '+ico('arrow-right')+'</button>');return;}if(name==='show-progress'){closeModal();page='progress';render();}}
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.page){page=b.dataset.page;render();root.querySelector('#hd-announcement').textContent=page==='home'?'Գլխավոր էջ':'Առաջընթացի էջ';}else if(b.dataset.device){frame.classList.toggle('hd-phone',b.dataset.device==='mobile');root.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}else if(b.dataset.filter){filter=b.dataset.filter;render();root.querySelector(`[data-filter="${filter}"]`).focus();}else if(b.dataset.skill!==undefined){const s=skills[Number(b.dataset.skill)];openModal(title('ՀՄՏՈՒԹՅԱՆ ՄԱՆՐԱՄԱՍՆԵՐ',s.name)+status(s.kind)+`<dl><div><dt>Վարժանքի ցուցանիշ</dt><dd>${s.value===null?'Տվյալներ դեռ չկան':s.value+'%'}</dd></div><div><dt>Ուսումնական պատասխաններ</dt><dd>${s.answers}</dd></div><div><dt>Հաստատված յուրացում</dt><dd>Դեռ չի ստուգվել</dd></div></dl><p>${s.kind==='ready'?'Հմտությունը պատրաստ է ստուգման։ Գլխի ստուգումը կբացվի բոլոր պահանջների կատարման դեպքում։':s.kind==='work'?'Շարունակեք վարժանքը՝ այս հմտությունն ամրապնդելու համար։':'Այս հմտության վարժանքի տվյալներ դեռ չկան։'}</p><button type="button" class="hd-primary" data-action="resume">Շարունակել ընթացիկ վարժանքը ${ico('arrow-right')}</button>`);}else if(b.dataset.action)action(b.dataset.action);});
root.querySelector('#hd-state').addEventListener('change',e=>{state=e.target.value;filter='all';closeModal();render();});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
root.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const focusables=[...overlay.querySelectorAll('button,input,select')].filter(el=>!el.disabled);const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
})();
</script>
