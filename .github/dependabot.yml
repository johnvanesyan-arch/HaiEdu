version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 2
    groups:
      development-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns: ["actions/*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
