name: Chapter II pilot read acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/chapter-ii-pilot-read-acceptance.mjs
      - .github/workflows/chapter-ii-pilot-read-acceptance.yml
      # Verify preserved pilot access after reviewed shared reporting/runtime changes.
      - web/assessment-reporting.mjs
      - web/course-page.js
      - web/learning-player.mjs
      - web/learning-audio.mjs
      - web/assessed-audio.mjs
      - web/learning-task-set.mjs
      - supabase/migrations/*_sprint_15c15_assessment_policy_v2.sql
      # Written only after activation is verified; preparation merges do not run live QA.
      - docs/evidence/chapter-ii-pilot-activation-20261013.json

permissions:
  contents: read

concurrency:
  group: sprint-14-isolation-qa
  cancel-in-progress: false

jobs:
  authenticated-read-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require reviewed main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this frontend revision on production
        run: node scripts/wait-for-production-release.mjs
      - name: Verify Chapter II and preserved Chapter I without creating learning records
        run: node scripts/chapter-ii-pilot-read-acceptance.mjs
        env:
          QA_TENANT_FIXTURES_JSON: ${{ vars.QA_TENANT_FIXTURES_JSON }}
          QA_SCHOOL_A_ADMIN_EMAIL: ${{ secrets.QA_SCHOOL_A_ADMIN_EMAIL }}
          QA_SCHOOL_A_ADMIN_PASSWORD: ${{ secrets.QA_SCHOOL_A_ADMIN_PASSWORD }}
          QA_SCHOOL_A_TEACHER_EMAIL: ${{ secrets.QA_SCHOOL_A_TEACHER_EMAIL }}
          QA_SCHOOL_A_TEACHER_PASSWORD: ${{ secrets.QA_SCHOOL_A_TEACHER_PASSWORD }}
          QA_SCHOOL_A_STUDENT_EMAIL: ${{ secrets.QA_SCHOOL_A_STUDENT_EMAIL }}
          QA_SCHOOL_A_STUDENT_PASSWORD: ${{ secrets.QA_SCHOOL_A_STUDENT_PASSWORD }}
          QA_SCHOOL_B_ADMIN_EMAIL: ${{ secrets.QA_SCHOOL_B_ADMIN_EMAIL }}
          QA_SCHOOL_B_ADMIN_PASSWORD: ${{ secrets.QA_SCHOOL_B_ADMIN_PASSWORD }}
          QA_SCHOOL_B_TEACHER_EMAIL: ${{ secrets.QA_SCHOOL_B_TEACHER_EMAIL }}
          QA_SCHOOL_B_TEACHER_PASSWORD: ${{ secrets.QA_SCHOOL_B_TEACHER_PASSWORD }}
          QA_SCHOOL_B_STUDENT_EMAIL: ${{ secrets.QA_SCHOOL_B_STUDENT_EMAIL }}
          QA_SCHOOL_B_STUDENT_PASSWORD: ${{ secrets.QA_SCHOOL_B_STUDENT_PASSWORD }}
      - name: Upload redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-ii-pilot-read-acceptance
          path: qa-results/chapter-ii-pilot-read-acceptance.json
          if-no-files-found: warn
          retention-days: 14
