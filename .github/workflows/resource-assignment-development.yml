name: Resource assignment isolated development
on:
  push:
    branches: [codex/resource-assignments-20261028]
    paths: [.github/workflows/resource-assignment-development.yml]
permissions:
  contents: read
jobs:
  assignment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: phase3_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: phase3_qa_root
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phase3_fixture -d phase3_qa_root"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PHASE3_POSTGRES_17_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Syntax and QA dependency graph
        run: |
          node scripts/check-web-syntax.mjs
          node --check scripts/resource-assignments-acceptance.mjs
          node --check tests/browser/resource-assignments.browser.test.mjs
          node scripts/check-browser-qa-triggers.mjs
      # Reflow regression includes narrow screen and enlarged text.
      # Unchanged SQL/privacy and races passed in 40579507902.
      - name: Strict handler regressions
        run: node --test tests/resource-assignments-handler.test.mjs

      - name: Install Chromium
        if: ${{ always() }}
        run: npx playwright install --with-deps chromium
      - name: Native delivery and existing library/home regressions
        if: ${{ always() }}
        run: node --test --test-concurrency=1 tests/browser/resource-assignments.browser.test.mjs
