name: Resource assignment isolated development
on:
  push:
    branches: [codex/resource-assignments-20261028]
    paths: [.github/workflows/resource-assignment-development.yml]
permissions:
  contents: read
jobs:
  assignment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check the new handler
        run: node --check supabase/functions/_shared/resource-assignments-handler.mjs
      - name: Exercise the actual SQL and recipient contract in disposable PGlite
        run: node --test tests/resource-assignments.test.mjs
