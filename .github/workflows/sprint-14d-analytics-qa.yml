name: Sprint 14D authenticated analytics QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/migrations/20261112172643_bf16_actor_rate_budgets.sql
      - web/rate-budget-feedback.mjs
      - web/auth-challenge-config.mjs
      - web/auth-challenge.css
      - web/auth-challenge.mjs
      - web/auth-feedback.mjs
      - scripts/build-web-assets.mjs
      - scripts/check-web-archive.mjs
      - scripts/verify-built-release.mjs
      - web-build/**
      - scripts/build-browser-sdk.mjs
      - web/supabase-browser.mjs
      - web/supabase-browser.bundle.mjs
      - web/account-signout.mjs
      - web/navigation-focus.mjs
      - web/task-privacy-view.mjs
      - 'web/student-forest.css'
      - 'web/student-surfaces.css'
      - 'web/assets/fonts/**'
      - scripts/sprint-14d-analytics-qa.mjs
      - scripts/wait-for-production-release.mjs
      - scripts/stamp-release.mjs
      - web/admin.*
      - web/admin-security.js
      - web/admin-deletion-confirmation.js
      - web/school-admin.html
      - web/school-admin.css
      - web/school-admin.js
      # Login, shared navigation and styles can break the same acceptance flow.
      - web/account-access.*
      - web/account-roles.js
      - web/learning-navigation.mjs
      - web/text-safety.mjs
      - web/analytics-provenance.mjs
      - web/assessment-reporting.mjs
      - web/school-analytics-view.mjs
      - web/class-history.mjs
      - web/config.js
      - web/school-membership-status.js
      - web/forest-tokens.css
      - web/staff-forest.css
      - web/role-layout.*
      - web/styles.css
      - web/ux.*
      - supabase/functions/get-school-performance-analytics/**
      - supabase/functions/_shared/**
      - package.json
      - package-lock.json
      - vercel.json
      - .github/workflows/sprint-14d-analytics-qa.yml

permissions:
  contents: read

concurrency:
  group: sprint-14-isolation-qa
  cancel-in-progress: false
  queue: max

jobs:
  authenticated-school-analytics:
    # Production QA autorun switch: automatic runs skip unless the repository
    # variable PRODUCTION_QA_AUTORUN is 'true'. Manual runs always execute.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PRODUCTION_QA_AUTORUN == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require reviewed main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Bound Ubuntu downloads for browser acceptance
        run: |
          # Runner-only transport settings; package signatures and TLS verification stay enabled.
          # Bound slow mirror downloads without changing package trust or test timeouts.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-haiedu-ci >/dev/null
      - run: npx playwright install --with-deps chromium
      - name: Wait for this frontend revision on production
        run: node scripts/wait-for-production-release.mjs
      - name: Run read-only two-school analytics acceptance
        run: node scripts/sprint-14d-analytics-qa.mjs
        env:
          QA_WEB_ORIGIN: https://www.haiedu.am
          QA_TENANT_FIXTURES_JSON: ${{ vars.QA_TENANT_FIXTURES_JSON }}
          QA_SCHOOL_A_ADMIN_EMAIL: ${{ secrets.QA_SCHOOL_A_ADMIN_EMAIL }}
          QA_SCHOOL_A_ADMIN_PASSWORD: ${{ secrets.QA_SCHOOL_A_ADMIN_PASSWORD }}
          QA_SCHOOL_B_ADMIN_EMAIL: ${{ secrets.QA_SCHOOL_B_ADMIN_EMAIL }}
          QA_SCHOOL_B_ADMIN_PASSWORD: ${{ secrets.QA_SCHOOL_B_ADMIN_PASSWORD }}
      - name: Upload redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprint-14d-analytics-evidence
          path: qa-results/sprint-14d-analytics.json
          if-no-files-found: warn
          retention-days: 14
