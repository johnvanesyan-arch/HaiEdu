name: Isolated teacher startup development
on:
  push:
    branches: [codex/teacher-startup-performance-20261029]
permissions:
  contents: read
concurrency:
  group: teacher-startup-isolated-development
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Bound Ubuntu downloads
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-codex-bounded
      - run: npx playwright install --with-deps chromium
      - run: npm run check:teacher-bundle
      - name: Verify actual bundled teacher journeys with isolated SQL
        run: node --test --test-concurrency=1 tests/browser/teacher-performance.browser.test.mjs tests/browser/teacher-today.browser.test.mjs tests/browser/teacher-feedback.browser.test.mjs tests/browser/forest-staff.browser.test.mjs
        env:
          STUDENT_LAYOUT_SCREENSHOTS_DIR: qa-results/teacher-startup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-teacher-startup
          path: qa-results
          retention-days: 7
