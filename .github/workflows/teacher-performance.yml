name: Teacher performance acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [baseline, after]
        default: baseline
        required: true
      fixtureScope:
        type: choice
        options: [all, A, B]
        default: all
        required: true
  push:
    branches: [main]
    paths:
      - scripts/teacher-performance-acceptance.mjs
      - scripts/teacher-home-readiness.mjs
      - .github/workflows/teacher-performance.yml
permissions:
  contents: read
concurrency:
  group: sprint-14-isolation-qa
  cancel-in-progress: false
  queue: max
jobs:
  teacher-performance:
    # Production QA autorun switch: automatic runs skip unless the repository
    # variable PRODUCTION_QA_AUTORUN is 'true'. Manual runs always execute.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PRODUCTION_QA_AUTORUN == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require reviewed main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure only designated teacher reads
        run: node scripts/teacher-performance-acceptance.mjs
        env:
          TEACHER_PERF_SCOPE: ${{ inputs.fixtureScope || 'all' }}
          TEACHER_PERF_PHASE: ${{ inputs.phase || 'after' }}
          QA_TENANT_FIXTURES_JSON: ${{ vars.QA_TENANT_FIXTURES_JSON }}
          QA_SCHOOL_A_TEACHER_EMAIL: ${{ secrets.QA_SCHOOL_A_TEACHER_EMAIL }}
          QA_SCHOOL_A_TEACHER_PASSWORD: ${{ secrets.QA_SCHOOL_A_TEACHER_PASSWORD }}
          QA_SCHOOL_B_TEACHER_EMAIL: ${{ secrets.QA_SCHOOL_B_TEACHER_EMAIL }}
          QA_SCHOOL_B_TEACHER_PASSWORD: ${{ secrets.QA_SCHOOL_B_TEACHER_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: teacher-performance-evidence
          path: qa-results/teacher-performance.json
          retention-days: 14
