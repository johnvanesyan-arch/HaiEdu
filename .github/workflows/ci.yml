name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check mirrored core parity
        run: npm run check:core-parity

      - name: Check platform favicon
        run: npm run check:favicon

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/home-dashboard.js
          node --check web/home-class.js
          node --check web/home-practice-router.js
          node --check web/home-assessment-router.js
          node --check web/course-gate.js
          node --check web/physics-7.js
          node --check web/practice.js
          node --check web/assessment.js
          node --check web/diagnostic.js
          node --check web/mastery.js
          node --check web/progress.js
          node --check web/remediation.js
          node --check web/mastery-dashboard.js
          node --check web/session-watchdog.js
          node --check web/join.js
          node --check web/teacher.js
          node --check web/content.js
          node --check web/content-workspace.js
          node --check web/content-home.js
          node --check web/content-review.js
          node --check web/content-curriculum-map.js
          node --check web/content-evidence-page.js
          node --check web/ux.js
          node --check web/role-router.js
          node --check web/role-layout.js
          node --check web/student-shell.js
          node --check web/privacy.js
          node --check web/admin.js
          node --check web/admin-security.js
          node --check scripts/check-core-parity.mjs
          node --check scripts/check-favicon-coverage.mjs

  role-layout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify dashboard observer and browser responsiveness
        run: node --test tests/browser/role-layout.browser.test.mjs


  institutional-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test tools
        run: python -m pip install pgserver==0.1.4 'psycopg[binary]==3.2.6'
      - name: Verify administrator and teacher offboarding races
        run: python tests/sprint-14b-offboarding-concurrency.py
      - name: Verify isolated Phase 3 content races
        run: python tests/phase3-content-concurrency.py

  phase3-postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: phase3_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: phase3_qa_root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase3_fixture -d phase3_qa_root"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PHASE3_POSTGRES_17_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Verify isolated Phase 3 races on PostgreSQL 17.6
        run: python tests/phase3-content-concurrency.py
      - name: Execute analytics SQL, handler and Evidence page with PostgreSQL 17.6
        run: node --test tests/phase3-analytics-integration.test.mjs
