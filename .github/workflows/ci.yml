name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check mirrored core parity
        run: npm run check:core-parity

      - name: Check platform favicon
        run: npm run check:favicon

      - name: Check browser QA dependency coverage
        run: node scripts/check-browser-qa-triggers.mjs

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check browser JavaScript syntax
        run: |
          node scripts/check-web-syntax.mjs
          node --check scripts/check-core-parity.mjs
          node --check scripts/check-favicon-coverage.mjs

  role-layout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bound Ubuntu downloads for the browser gate
        run: |
          # Runner-only transport settings; package signatures and TLS verification stay enabled.
          # The Azure HTTP mirror twice consumed most of this job's ten-minute bound.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-haiedu-ci >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser responsiveness and lifecycle regressions
        run: node --test tests/browser/*.test.mjs
        env:
          STUDENT_LAYOUT_SCREENSHOTS_DIR: artifacts/student-workspace
      - name: Keep isolated student interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-workspace-browser
          path: artifacts/student-workspace
          if-no-files-found: ignore
          retention-days: 14


  institutional-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test tools
        run: python -m pip install pgserver==0.1.4 'psycopg[binary]==3.2.6'
      - name: Verify administrator and teacher offboarding races
        run: python tests/sprint-14b-offboarding-concurrency.py
      - name: Verify isolated Phase 3 content races
        run: python tests/phase3-content-concurrency.py
      - name: Verify misconception review and existing item-write races
        run: python tests/misconception-review-concurrency.py

  phase3-postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: phase3_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: phase3_qa_root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase3_fixture -d phase3_qa_root"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PHASE3_POSTGRES_17_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Verify isolated Phase 3 races on PostgreSQL 17.6
        run: python tests/phase3-content-concurrency.py
      - name: Verify misconception review and existing item-write races
        run: python tests/misconception-review-concurrency.py
      - name: Execute analytics SQL, handler and Evidence page with PostgreSQL 17.6
        run: node --test tests/phase3-analytics-integration.test.mjs
      - name: Verify connected two-subject two-unit Edge and SQL acceptance
        run: node --test tests/learning-acceptance.test.mjs
      - name: Verify versioned scoring, readiness, reporting and preserved v1 rules
        run: node --test tests/assessment-v2.test.mjs
      - name: Verify typed-field normalization, drafts, scoring and scope on PostgreSQL 17.6
        run: node --test tests/typed-fields.test.mjs tests/typed-fields-authoring.test.mjs tests/arrangement-responses.test.mjs tests/arrangement-authoring.test.mjs tests/learning-audio.test.mjs tests/learning-audio-handler.test.mjs tests/shared-task-sets.test.mjs tests/shared-task-set-handler.test.mjs tests/shared-task-set-authoring.test.mjs tests/assessed-audio.test.mjs tests/assessed-audio-handler.test.mjs
      - name: Verify written-work submissions, marking and authorization on PostgreSQL 17.6
        run: node --test tests/written-work.test.mjs tests/written-work-handler.test.mjs tests/unit-materials.test.mjs tests/unit-guides.test.mjs tests/teacher-today.test.mjs tests/teacher-today-api.test.mjs
      - name: Verify supplementary material lifecycle, authorization and PDF delivery
        run: node --test tests/supplementary-resources.test.mjs tests/supplementary-resources-handler.test.mjs
      - name: Verify resource assignment recipients, delivery and handler
        run: node --test --test-concurrency=1 tests/resource-assignments.test.mjs tests/resource-assignments-handler.test.mjs
      - name: Verify resource assignment races
        run: python tests/resource-assignments-concurrency.py
      - name: Verify supplementary publication and delivery races
        run: python tests/supplementary-resources-concurrency.py
      - name: Verify material revision, approval and reviewer-session races
        run: python tests/unit-materials-concurrency.py
      - name: Verify guide delivery, assessment start and revocation races
        run: python tests/unit-guides-concurrency.py
      - name: Verify written-work save, submit, mark and revocation races
        run: python tests/written-work-concurrency.py
      - name: Verify atomic answer scoring with independent PostgreSQL 17.6 connections
        run: python tests/answer-scoring-concurrency.py
      - name: Verify governed policy and session authorization races on PostgreSQL 17.6
        run: python tests/governed-session-concurrency.py
      - name: Verify read-only learning navigation and dashboard revocation races
        run: python tests/learning-dashboard-concurrency.py
      - name: Verify governed learning API, answer and review races on PostgreSQL 17.6
        run: python tests/governed-runtime-concurrency.py
      - name: Verify disjoint curriculum release activation races
        run: python tests/release-unit-concurrency.py
      - name: Verify assessed listening allowances and cancellation races
        run: python tests/assessed-audio-concurrency.py
      - name: Verify shared-source exposure and allocation races
        run: python tests/shared-task-sets-concurrency.py
      - name: Verify governed whole-form mastery selection races
        run: python tests/governed-mastery-forms-concurrency.py

  platform-release-checks:
    name: Platform release checks
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [test, role-layout-browser, institutional-concurrency, phase3-postgres-17]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require every platform check to succeed
        env:
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-release-readiness.mjs
