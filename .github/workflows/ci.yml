name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/home-dashboard.js
          node --check web/home-practice-router.js
          node --check web/home-assessment-router.js
          node --check web/physics-7.js
          node --check web/practice.js
          node --check web/assessment.js
          node --check web/diagnostic.js
          node --check web/mastery.js
          node --check web/remediation.js
          node --check web/mastery-dashboard.js
          node --check web/session-watchdog.js
          node --check web/join.js
          node --check web/teacher.js
          node --check web/content.js
          node --check web/ux.js
          node --check web/role-router.js
          node --check web/student-shell.js
          node --check web/privacy.js
          node --check web/admin.js
