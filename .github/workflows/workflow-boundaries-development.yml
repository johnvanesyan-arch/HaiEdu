name: Isolated workflow boundaries development
on:
  push:
    branches: [codex/workflow-boundaries-20261028]
permissions:
  contents: read
jobs:
  focused-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Bound Chromium dependency downloads
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-haiedu-ci >/dev/null
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 tests/browser/resource-assignments.browser.test.mjs tests/browser/supplementary-resources.browser.test.mjs tests/browser/teacher-performance.browser.test.mjs tests/browser/teacher-workflows-guide.browser.test.mjs tests/browser/written-work.browser.test.mjs tests/browser/student-home.browser.test.mjs tests/browser/student-workspace.browser.test.mjs
        env:
          STUDENT_LAYOUT_SCREENSHOTS_DIR: qa-results/workflow-boundaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-workflow-boundaries
          path: qa-results/workflow-boundaries
          retention-days: 7
