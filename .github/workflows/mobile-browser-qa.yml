name: Mobile browser QA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  mobile-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bound Ubuntu downloads for browser acceptance
        run: |
          # Runner-only transport settings; package signatures and TLS verification stay enabled.
          # Bound slow mirror downloads without changing package trust or test timeouts.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-haiedu-ci >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify required QA secrets
        shell: bash
        env:
          QA_LEARNER_EMAIL: ${{ secrets.QA_LEARNER_EMAIL }}
          QA_LEARNER_PASSWORD: ${{ secrets.QA_LEARNER_PASSWORD }}
          QA_TEACHER_EMAIL: ${{ secrets.QA_TEACHER_EMAIL }}
          QA_TEACHER_PASSWORD: ${{ secrets.QA_TEACHER_PASSWORD }}
        run: |
          test -n "$QA_LEARNER_EMAIL"
          test -n "$QA_LEARNER_PASSWORD"
          test -n "$QA_TEACHER_EMAIL"
          test -n "$QA_TEACHER_PASSWORD"

      - name: Run authenticated mobile tests
        run: npm run test:e2e:mobile
        env:
          PLAYWRIGHT_BASE_URL: https://www.haiedu.am
          QA_LEARNER_EMAIL: ${{ secrets.QA_LEARNER_EMAIL }}
          QA_LEARNER_PASSWORD: ${{ secrets.QA_LEARNER_PASSWORD }}
          QA_TEACHER_EMAIL: ${{ secrets.QA_TEACHER_EMAIL }}
          QA_TEACHER_PASSWORD: ${{ secrets.QA_TEACHER_PASSWORD }}

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

