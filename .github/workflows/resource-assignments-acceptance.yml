name: Resource assignment production acceptance
# Standalone B.8.2 workflow-boundary acceptance after shared pending-queue cancellation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-web-assets.mjs
      - scripts/check-web-archive.mjs
      - scripts/verify-built-release.mjs
      - web-build/**
      - web/**
      - supabase/functions/**
      - supabase/migrations/**
      - scripts/**
      - docs/qa/additional-programme-fixtures.json
      - package.json
      - package-lock.json
      - vercel.json
      - .github/workflows/resource-assignments-acceptance.yml
permissions:
  contents: read
concurrency:
  group: sprint-14-isolation-qa
  cancel-in-progress: false
  queue: max
jobs:
  acceptance:
    # Production QA autorun switch: automatic runs skip unless the repository
    # variable PRODUCTION_QA_AUTORUN is 'true'. Manual runs always execute.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PRODUCTION_QA_AUTORUN == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require reviewed main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the intended production revision
        run: node scripts/wait-for-production-release.mjs
      - name: Verify class and selected assignment delivery with dedicated fixtures
        run: node scripts/resource-assignments-acceptance.mjs
        env:
          QA_TENANT_FIXTURES_JSON: ${{ vars.QA_TENANT_FIXTURES_JSON }}
          QA_SCHOOL_A_ADMIN_EMAIL: ${{ secrets.QA_SCHOOL_A_ADMIN_EMAIL }}
          QA_SCHOOL_A_ADMIN_PASSWORD: ${{ secrets.QA_SCHOOL_A_ADMIN_PASSWORD }}
          QA_SCHOOL_A_TEACHER_EMAIL: ${{ secrets.QA_SCHOOL_A_TEACHER_EMAIL }}
          QA_SCHOOL_A_TEACHER_PASSWORD: ${{ secrets.QA_SCHOOL_A_TEACHER_PASSWORD }}
          QA_SCHOOL_A_STUDENT_EMAIL: ${{ secrets.QA_SCHOOL_A_STUDENT_EMAIL }}
          QA_SCHOOL_A_STUDENT_PASSWORD: ${{ secrets.QA_SCHOOL_A_STUDENT_PASSWORD }}
          QA_SCHOOL_B_ADMIN_EMAIL: ${{ secrets.QA_SCHOOL_B_ADMIN_EMAIL }}
          QA_SCHOOL_B_ADMIN_PASSWORD: ${{ secrets.QA_SCHOOL_B_ADMIN_PASSWORD }}
          QA_SCHOOL_B_TEACHER_EMAIL: ${{ secrets.QA_SCHOOL_B_TEACHER_EMAIL }}
          QA_SCHOOL_B_TEACHER_PASSWORD: ${{ secrets.QA_SCHOOL_B_TEACHER_PASSWORD }}
          QA_SCHOOL_B_STUDENT_EMAIL: ${{ secrets.QA_SCHOOL_B_STUDENT_EMAIL }}
          QA_SCHOOL_B_STUDENT_PASSWORD: ${{ secrets.QA_SCHOOL_B_STUDENT_PASSWORD }}
      - name: Preserve redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resource-assignments-acceptance
          path: |
            qa-results/resource-assignments.json
            qa-results/resource-form
            qa-results/custom-task-*.png
          retention-days: 14
