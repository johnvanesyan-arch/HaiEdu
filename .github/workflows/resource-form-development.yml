name: Isolated resource form development
on:
  push:
    branches: [codex/resource-pdf-first-20261028]
permissions:
  contents: read
jobs:
  focused-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 tests/browser/resource-assignments.browser.test.mjs tests/browser/supplementary-resources.browser.test.mjs
        env:
          STUDENT_LAYOUT_SCREENSHOTS_DIR: qa-results/resource-form
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-resource-form
          path: qa-results/resource-form
          retention-days: 7
