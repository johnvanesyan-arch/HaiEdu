name: Sprint 14 authenticated action QA
# Dedicated B.9 staff acceptance slot after shared pending-queue cancellation.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-teacher-entry.mjs
      - web/teacher-dependencies.bundle.mjs
      - web/teacher-dependencies.mjs
      - scripts/qa-programme-fixtures.mjs
      - docs/qa/additional-programme-fixtures.json
      - web/teacher-feedback.mjs
      - web/written-work.mjs
      - web/written-work.css
      - scripts/teacher-today-acceptance.mjs
      - scripts/sprint-14-actions.mjs
      - scripts/sprint-14-action-guards.mjs
      - scripts/sprint-14-isolation.mjs
      - scripts/wait-for-production-release.mjs
      - scripts/stamp-release.mjs
      # The runner exercises both pages; shared dependencies must activate it too.
      - web/subject-visuals.mjs
      - web/teacher-today.css
      - web/teacher-today.mjs
      - web/teacher.*
      - web/teacher-workflows.html
      - web/teacher-workflows.css
      - web/student-forest.css
      - web/student-surfaces.css
      - web/archive-browser.mjs
      - web/assessment-reporting.mjs
      - web/school-admin.*
      - web/forest-tokens.css
      - web/staff-forest.css
      - web/role-layout.*
      - web/ux.*
      - web/account-roles.js
      - web/learning-navigation.mjs
      - web/analytics-provenance.mjs
      - web/school-analytics-view.mjs
      - web/config.js
      - web/school-membership-status.js
      - web/tokens.css
      - web/base.css
      - web/styles.css
      - web/components.css
      - web/responsive-qa.css
      - supabase/functions/get-school-admin-overview/**
      - supabase/functions/get-school-teachers/**
      - supabase/functions/get-student-classes/**
      - supabase/functions/get-teacher-academic-context/**
      - supabase/functions/get-teacher-dashboard/**
      - supabase/functions/get-teacher-workspace/**
      - supabase/functions/manage-teacher-feedback/**
      - supabase/migrations/*_teacher_feedback_workspace.sql
      - supabase/migrations/20261028180038_teacher_today_workspace.sql
      - supabase/functions/get-teacher-student/**
      - supabase/functions/manage-institutional-invitation/**
      - supabase/functions/manage-institutional-membership/**
      - supabase/functions/manage-institutional-teacher-class/**
      - supabase/functions/manage-school-teacher/**
      - supabase/functions/manage-school-academic-year/**
      - supabase/functions/manage-staff-invitation/**
      - supabase/functions/manage-student-invitation/**
      - supabase/functions/manage-teacher-subject/**
      - supabase/functions/redeem-institutional-invitation/**
      - supabase/functions/_shared/**
      - package.json
      - package-lock.json
      - vercel.json
      - .github/workflows/sprint-14-actions-qa.yml

permissions:
  contents: read

concurrency:
  # Serialize designated fixtures with the read-only chapter acceptance run.
  group: sprint-14-isolation-qa
  cancel-in-progress: false

jobs:
  authenticated-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require reviewed main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Bound Ubuntu downloads for browser acceptance
        run: |
          # Runner-only transport settings; package signatures and TLS verification stay enabled.
          # Bound slow mirror downloads without changing package trust or test timeouts.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-haiedu-ci >/dev/null
      - run: npx playwright install --with-deps chromium
      - name: Wait for this frontend revision on production
        run: node scripts/wait-for-production-release.mjs
      - name: Run authenticated actions with disposable records
        run: node scripts/sprint-14-actions.mjs
        env:
          QA_TENANT_FIXTURES_JSON: ${{ vars.QA_TENANT_FIXTURES_JSON }}
          QA_SCHOOL_A_ADMIN_EMAIL: ${{ secrets.QA_SCHOOL_A_ADMIN_EMAIL }}
          QA_SCHOOL_A_ADMIN_PASSWORD: ${{ secrets.QA_SCHOOL_A_ADMIN_PASSWORD }}
          QA_SCHOOL_A_TEACHER_EMAIL: ${{ secrets.QA_SCHOOL_A_TEACHER_EMAIL }}
          QA_SCHOOL_A_TEACHER_PASSWORD: ${{ secrets.QA_SCHOOL_A_TEACHER_PASSWORD }}
          QA_SCHOOL_A_STUDENT_EMAIL: ${{ secrets.QA_SCHOOL_A_STUDENT_EMAIL }}
          QA_SCHOOL_A_STUDENT_PASSWORD: ${{ secrets.QA_SCHOOL_A_STUDENT_PASSWORD }}
          QA_SCHOOL_B_ADMIN_EMAIL: ${{ secrets.QA_SCHOOL_B_ADMIN_EMAIL }}
          QA_SCHOOL_B_ADMIN_PASSWORD: ${{ secrets.QA_SCHOOL_B_ADMIN_PASSWORD }}
          QA_SCHOOL_B_TEACHER_EMAIL: ${{ secrets.QA_SCHOOL_B_TEACHER_EMAIL }}
          QA_SCHOOL_B_TEACHER_PASSWORD: ${{ secrets.QA_SCHOOL_B_TEACHER_PASSWORD }}
          QA_SCHOOL_B_STUDENT_EMAIL: ${{ secrets.QA_SCHOOL_B_STUDENT_EMAIL }}
          QA_SCHOOL_B_STUDENT_PASSWORD: ${{ secrets.QA_SCHOOL_B_STUDENT_PASSWORD }}
      - name: Upload redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-14-actions-evidence
          path: qa-results/sprint-14-actions.json
          if-no-files-found: warn
          retention-days: 14
